# 由 scripts/migrate/json2yaml.py 从 content/crossing.js 转换
# （条件表达式已转 Python 语法；业务内容原样，未人工校对）
scenes:
  crossing.start:
    title: 渡口 · 雾夜
    text: '你赶到江边的野渡，最后一班船已经走了。雾从江心漫上来，浓得把对岸都吞了。

      渡口只有一个草棚、一口钟楼、一条横着的旧船。你认得这渡口——货主沈老爷今夜要携一箱账册夜渡，去对岸的府城结账。船主吴老大蹲在岸边抽烟，火光在雾里一明一灭。

      子时前后，江上忽然传出一声闷响，像什么重东西砸进水里。之后是半句没喊完的话，被雾吞了。

      天快亮时，你听说：沈老爷的船还横在江上，人不见了。'
    choices:
    - text: 雾这么大，你倒要看看这渡口出了什么事
      goto: crossing.dock
  crossing.dock:
    title: 查夜 · 渡口码头
    text: '你站在码头上。雾比夜里薄了些，江面泛着鱼肚白。旧船横在岸边，缆绳松松地拖着；巷口那边，打更的老张还没收更。

      沈老爷是这渡口最大的客商，他要是在江里出了事，半个府城的账都要乱。你想起那声闷响，还有那半句没喊完的话——昨夜这渡口上，总有人看见了什么。

      问题是：先听谁的？'
    choices:
    - text: 去钟楼，看那口传说自己响起来的钟
      goto: crossing.bell
    - text: 去渡船，看沈老爷留下的船
      goto: crossing.boatman.see
    - text: 去巷口，找打更的老张
      goto: crossing.watchman.see
    - text: 去芦苇荡，看湿衣人走的方向
      goto: crossing.reed
    - text: 去渡口草棚，看账房金先生的行囊
      goto: crossing.shed
    - text: 天亮了——去江边，看那具浮尸
      goto: crossing.body
    - text: 两边的证词都听过了——去拼一拼
      if: crossingClues.splash >= 1  or  crossingClues.wetman >= 1
      goto: crossing.merge
    - text: 雾散了，你什么都没查清——离开这渡口
      goto: crossing.end-fog
  crossing.bell:
    title: 钟楼 · 十三下
    text: '钟楼很小，一口锈钟挂在梁上。你数了数钟绳上结的记号，打了半辈子更的老张，每夜子时敲三下。

      可昨夜子时，这口钟响了十三下。老张赌咒说不是他敲的——他当时在巷口换班，钟楼里没有人。

      雾夜，江面，十三下钟声。这渡口的老人说，钟响十三下，是要死人。你伸手推了推那口钟，钟身纹丝不动，可钟楼的地上，有一串湿漉漉的脚印，从江边一路进来，又原路出去。'
    choices:
    - text: 记下：钟声十三下，钟楼有湿脚印
      if: not crossingClues.bell
      do:
        crossingClues.bell: 1
      goto: crossing.dock
    - text: 回码头，去别处看看
      goto: crossing.dock
  crossing.boatman.see:
    title: 渡船 · 空船
    text: '沈老爷的船横在岸边，缆绳松着，船舱里空无一人。你上船看了一圈：船尾的木板上有一道拖拽的痕，像什么重东西被拖到船边；舱里一只上锁的铁箱不见了，只留下一截被水泡胀的箱绳。

      帮工船夫老周蹲在岸上，望着江面出神。他在这条船上干了十年，昨夜子时，他就在这条船上。'
    choices:
    - text: 去找船夫老周，问昨夜的事
      goto: crossing.boatman
    - text: 记下：船尾有拖拽痕，铁箱不见了
      if: not crossingClues.trail
      do:
        crossingClues.trail: 1
      goto: crossing.dock
  crossing.boatman:
    title: 渡船 · 子时的船夫
    text: '老周五十来岁，脸被江风吹得黑红。他看你上了船，把烟袋在鞋底上磕了磕："外乡客官，问昨夜的事？昨夜的事，怕你听了也不信。"

      沈老爷的船还横在江上，缆绳在水里一荡一荡。你掏出半包干烟叶递过去，老周的眼皮抬了抬，接下了。雾还罩在江面，船在水里轻轻晃。你知道这渡口的人都有各自藏着的话，能问多少，全看你的本事。'
    mode: dialogue
    dialogue:
      npc: 船夫老周
      notes: 3
      onEnd: crossing.dock
      topics:
      - id: splash
        name: 子时的那阵水声
        reply: 那阵水声在船尾，像什么重东西砸进水里，还带着半句"别松手"。我探头看，雾太大，只看见船主吴老大蹲在船尾解缆。
        effect:
          crossingClues.splash: 1
      - id: cargo
        name: 沈老爷带的铁箱
        reply: 一只铁箱，上了锁。沈老爷说是账册，可账册哪用锁？上船前他抱在怀里，谁碰跟谁急。
        effect:
          crossingClues.cargo: 1
      - id: wet
        name: 船主那夜的衣裳
        reply: 吴老大说去解缆，回来时裤腿湿到大腿。他说是浪打的——可那夜江面平得像镜子，哪来的浪。
        effect:
          crossingClues.wet: 1
      - id: debt
        name: 船主的近况
        reply: 吴老大这两年亏船本，欠了一屁股债，见着债主就躲。上月忽然阔绰起来，还给船新添了篷。
        effect:
          crossingClues.debt: 1
  crossing.watchman.see:
    title: 巷口 · 丑时
    text: '老张还在巷口，更锣横在膝上，脚边搁着一只湿漉漉的香囊。香囊是上好的苏绣，正面绣着一个"沈"字，浸了水，颜色有些洇开。

      "丑时三刻捡的。"老张说，"就在这巷口。我寻思着是谁丢的，后来一想——沈老爷的香囊，什么时候离过他的身？"

      你顺着巷口往芦苇荡的方向望，那里的雾还没散。'
    choices:
    - text: 向老张细细盘问昨夜的事
      goto: crossing.watchman
    - text: 记下：沈老爷的香囊湿着，落在巷口
      if: not crossingClues.pouch
      do:
        crossingClues.pouch: 1
      goto: crossing.dock
  crossing.watchman:
    title: 巷口 · 丑时的更夫
    text: '老张打了一辈子更，这渡口谁的身形他都认得。他把更锣往怀里一拢，眯着眼看你："客官要问昨夜的事？我打更的，最见不得夜里的勾当。"

      他说着又朝芦苇荡的方向望了一眼，那眼神像是还看着昨夜的那个影子。天光一点点亮起来，巷子里的雾正在散。你只有一盏茶的功夫，他还要去交更。'
    mode: dialogue
    dialogue:
      npc: 更夫老张
      notes: 3
      onEnd: crossing.dock
      topics:
      - id: wetman
        name: 丑时的湿衣人
        reply: 丑时三刻，一个湿衣人从江边往芦苇荡走。背影像吴老大——我打了半辈子更，这渡口谁的身形我都认得。
        effect:
          crossingClues.wetman: 1
      - id: pouch
        name: 捡到的香囊
        reply: 就这巷口捡的。沈老爷的香囊从不离身——离了身，就是人出了事。香囊还湿着，说明是从江边带上来的。
        effect:
          crossingClues.pouch: 1
      - id: bell
        name: 子时的钟声
        reply: 说来邪门。子时我换班，钟楼那口钟自己响了十三下。我在渡口三十年，没听过十三下。钟响十三下，是要死人。
        effect:
          crossingClues.bell: 1
      - id: quarrel
        name: 船主与沈老爷
        reply: 上船前，沈老爷和吴老大在岸边吵了一架。沈老爷撂了句狠话："少一个子儿，饶不了你。"吴老大没吭声。
        effect:
          crossingClues.quarrel: 1
  crossing.reed:
    title: 芦苇荡 · 湿脚印
    text: '芦苇荡在渡口下游，水浅，芦秆密得能藏人。你沿着荡边找，泥地上有一串湿脚印，从江边直直走进芦苇深处，又被拖平的草盖住半截。

      脚印很重，是一边走一边拖东西的样。你拨开芦秆往里看，荡心有个新挖的土坑，坑边散着几片水锈——像有什么铁器在这儿搁过，又被人取走了。'
    choices:
    - text: 记下：芦苇荡有湿脚印与土坑，铁箱在此搁过
      if: not crossingClues.reed
      do:
        crossingClues.reed: 1
      goto: crossing.dock
    - text: 回码头，去别处看看
      goto: crossing.dock
  crossing.shed:
    title: 草棚 · 失踪的行李
    text: '渡口的草棚是行商歇脚的地方。你掀开帘子，账房金先生睡过的草铺还在，被褥掀着，行李却不见了——问棚里的脚夫，都说天不亮金先生就背着包袱走了，往府城的方向，走得急，谁喊都不应。

      一个跟着沈老爷讨账的脚夫嘀咕："金先生昨夜还在，沈老爷一出事，他倒先走了。账册在他身上，铁箱的钥匙也在他腰上——沈老爷的东西，他比谁都门儿清。"'
    choices:
    - text: 记下：金先生天亮前携行李走了，钥匙在他腰上
      if: not crossingClues.baggage
      do:
        crossingClues.baggage: 1
      goto: crossing.dock
    - text: 回码头，去别处看看
      goto: crossing.dock
  crossing.body:
    title: 江边 · 浮尸
    text: '天亮了，江上浮起一具尸首，被渔人的网捞到岸边。是沈老爷。

      他身上的衣裳被水浸透，袖口撕破了，手里还攥着半截缆绳——不是解开的，是生生挣断的。仵作来看，说他后脑有伤，是砸的，落水前人就没了气。

      码头上一圈人站着看。吴老大也在，脸白得像江上的雾。金先生的草铺早空了。你站在人群外，把这夜里听见的、看见的，在脑子里过了一遍。'
    choices:
    - text: 回码头，把两边的证词拼一拼
      goto: crossing.dock
  crossing.merge:
    title: 拼夜 · 渡口
    text: '你坐在码头的石阶上，把两边的证词摆在眼前。

      船夫说：子时船尾有落水声，有半句"别松手"；吴老大解缆回来，裤腿湿到大腿；沈老爷的铁箱上了锁，上船前谁也不让碰。

      更夫说：丑时三刻，一个湿衣人从江边往芦苇荡走，身形像吴老大；巷口捡到沈老爷湿透的香囊；上船前两人在岸边吵过架。

      芦苇荡里有拖东西的脚印和土坑，草棚里金先生的行李不见了，钥匙在他腰上。

      把这些拼起来，是一个极老的故事：船主欠了债，账房握着钥匙，货主沉了江。可你到底只听见了一部分——拼不拼得全，就看你自己。'
    choices:
    - text: 两边的证词拼上了——落水的是沈老爷，湿衣取箱的是吴老大，金先生是内应
      if: crossingClues.splash >= 1  and  crossingClues.wetman >= 1
      goto: crossing.end-truth
    - text: 你只信船夫的话，硬指那夜当值的帮工老周
      if: crossingClues.splash >= 1
      goto: crossing.end-wrong
    - text: 你只信更夫的话，指吴老大，却拿不出落水的凭据
      if: crossingClues.wetman >= 1  and  not (crossingClues.splash >= 1)
      goto: crossing.end-half
    - text: 回码头，再问一遍
      goto: crossing.dock
    - text: 雾太浓了……你不想再查了
      goto: crossing.end-fog
  crossing.end-truth:
    title: 结局 · 拼夜
    text: '你把两边的证词并在一处，当众说清。

      "子时，船尾的落水声，是沈老爷被砸昏后推下去的。吴老大解缆是假，动手是真——他裤腿湿到大腿，那夜江面却平得像镜子。"

      "丑时，更夫看见的湿衣人往芦苇荡走。芦苇荡里的脚印，是一边走一边拖东西——拖的是那口铁箱。箱在荡心搁过，天亮前被取走了。"

      "取箱的人，是金先生。钥匙在他腰上，行李天亮前没了。船主欠了债，账房握着钥匙，货主沉了江。"

      吴老大"扑通"跪了，金先生在府城外的官道上被拦下，铁箱原封未动，账册一本不少。

      沈老爷的香囊被送回他家，他女人捧着香囊哭了一夜。

      渡口的雾散了。钟楼上的老钟再没响过十三下——打更的老张说，那口钟如今敲三下，声比从前清亮。有些夜，是得有人把它拼齐了，天才肯亮。'
    choices:
    - text: 再走一遭这渡口
      goto: '@restart'
  crossing.end-wrong:
    title: 结局 · 冤
    text: '你只听了船夫的话，把当值的帮工老周告到了码头管事那里。

      老周在船上干了十年，被一条湿裤腿的证词拖下了水。他没辩，只把烟袋在鞋底上磕了又磕，末了说："我要是图沈老爷的东西，还用在这条破船上熬十年？"

      管事收了你的状子。可吴老大在一旁补了句："老周那夜也在船尾，谁说得清？"

      老周被押走了。你后来才听说，吴老大把船卖了，搬去了对岸的府城，新买了条大船。金先生也走了，铁箱的事，再没人提。

      你站在渡口，看江水流。雾散了，天也亮了，可有些事，天亮了也拼不齐。'
    choices:
    - text: 再走一遭这渡口
      goto: '@restart'
  crossing.end-half:
    title: 结局 · 半拼
    text: '你只信了更夫的话，指吴老大是那湿衣人。吴老大不慌，摊开两只手："湿衣裳的是我——那夜我在江边解手，滑了一跤。芦苇荡我是去了，可我是去找沈老爷。他说江上有人喊，我怕出事。"

      你没有落水的凭据。沈老爷的尸首上后脑的伤，你说不清是谁砸的；铁箱的去向，你更说不上来。

      吴老大当众把湿衣的事圆了，反倒博了个"忠厚"的名声。没过几天，他卖了船，去了对岸。

      你只拼出了半个夜。另外半个，沉在江里，随雾散了。'
    choices:
    - text: 再走一遭这渡口
      goto: '@restart'
  crossing.end-fog:
    title: 结局 · 雾锁渡口
    text: '雾散了，你什么都没查清，背起包袱离开渡口。

      身后的事，是后来听行商说的：沈老爷的案子，以"失足落水"结了。他女人拿着香囊来渡口哭，哭完就把香囊烧在了江边。

      吴老大的船照旧横在渡口，只是换了个帮工。金先生再没回来过。钟楼上的钟，据说某个雾夜又响过十三下——打更的老张听见了，没敢上去看。

      你走官道的时候，回头望了一眼那渡口。雾已经散了，江面平静，像什么都没发生过。可你知道，江底沉着的东西，比雾还厚。

      有些夜，拼不齐，就让它沉着吧。'
    choices:
    - text: 再走一遭这渡口
      goto: '@restart'
