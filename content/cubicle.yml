# 由 scripts/migrate/json2yaml.py 从 content/cubicle.js 转换
# （条件表达式已转 Python 语法；业务内容原样，未人工校对）
scenes:
  cubicle.start:
    title: 格子间 · 周一
    text: '周一早晨，你刷卡进楼，电梯里挤满了和你一样的人：一样的衬衫，一样的包，一样的没睡醒。

      你坐到自己的格子间里。隔板很高，抬头看不见天，低头是一摊待办。

      电脑开机，屏幕亮起来，蓝色的桌面像一小块天空。你盯着它看了三秒，把昨晚没喝完的咖啡热了热。

      又是五天。'
    choices:
    - text: 开始这一周
      goto: cubicle.hub
  cubicle.hub:
    title: 格子间 · 一天
    text: '格子间的日子，一格一格地过。晨会、午休、加班、项目会，一格一格的，像打印机吐出来的纸，一页跟一页。

      你的工位在靠窗第三排——可惜窗在隔板外头。

      桌上贴着张便签，是上周五写的："再忍一忍。"

      你盯着便签看了一会儿。今日，这一格，怎么过？'
    choices:
    - text: 去开晨会
      goto: cubicle.morning
    - text: 午休，下楼走走
      goto: cubicle.noon
    - text: 今晚加班吗？——先把活揽下来
      goto: cubicle.evening
    - text: 去开项目会
      goto: cubicle.meeting
    - text: 周五了——该做个决定了
      if: flags.cubicle.morning  and  flags.cubicle.noon  and  flags.cubicle.evening  and  flags.cubicle.meeting
      goto: cubicle.merge
  cubicle.morning:
    title: 格子间 · 晨会
    text: '晨会上，经理在讲"狼性"。他讲得慷慨激昂，你看见前排有人偷偷刷手机，后排有人打哈欠。

      轮到汇报，你照例报了个"正常推进"。经理点点头，又问："这个季度，大家的目标都定高一点，有没有问题？"

      会议室安静了三秒。你看见同事们都低着头，像一排等着点名的秧苗。'
    onEnter:
      flags.cubicle.morning: true
    choices:
    - text: 「有问题。上季度的目标就没完成，定高一点，数字还是数字。」
      do:
        flags.cubicle.spoke: true
      goto: cubicle.hub
    - text: 「没问题。」——把头低下去
      goto: cubicle.hub
  cubicle.noon:
    title: 格子间 · 午休
    text: '午休一小时，你下楼，坐在写字楼门口的台阶上吃盒饭。

      阳光照下来，暖的。旁边坐着个外卖骑手，也在吃，吃得飞快。你们谁也没说话，就这么并排坐着，像两个暂时离了流水线的人。

      楼上的玻璃幕墙，把天切成一小块一小块。'
    onEnter:
      flags.cubicle.noon: true
    choices:
    - text: 给老家的母亲拨个电话，说一切都好
      do:
        flags.cubicle.called: true
      goto: cubicle.hub
    - text: 把盒饭吃完，赶在一点前上楼
      goto: cubicle.hub
  cubicle.evening:
    title: 格子间 · 加班
    text: '晚上八点，格子间里还有一半的灯亮着。你对着屏幕，改一份改了七遍的方案。

      第七遍的批注还是那两个字："重做。"

      隔壁工位的同事把键盘敲得啪啪响，忽然停了，长叹一口气，又继续敲。

      窗外的写字楼，一格一格亮着灯，像谁也没下过班。'
    onEnter:
      flags.cubicle.evening: true
    choices:
    - text: 把方案关掉，今天到此为止——活是干不完的
      do:
        flags.cubicle.dare: true
      goto: cubicle.hub
    - text: 再改第八遍——改到它满意为止
      goto: cubicle.hub
  cubicle.meeting:
    title: 格子间 · 项目会
    text: '项目会上，出了岔子。明明是需求方改了三次口径，经理却把锅往你头上扣："这个进度，就是执行力的问题。"

      同事们又低下头。你捏着手里的笔，指节发白。

      窗外，天已经全黑了。写字楼的灯，一盏也没少。'
    onEnter:
      flags.cubicle.meeting: true
    choices:
    - text: 「需求方改了三次，纪要都在。这不是执行力的问题，是流程的问题。」
      do:
        flags.cubicle.said: true
      goto: cubicle.hub
    - text: 「是我的问题，我今晚加急。」
      goto: cubicle.hub
  cubicle.merge:
    title: 格子间 · 周五
    text: '周五下午，格子间里的空气松了一些。有人已经在收拾包了。

      你坐在工位上，把这一周五天在脑子里过了一遍：晨会上的话、台阶上的阳光、第八遍的方案、会上的锅。

      桌角那张"再忍一忍"的便签，边角已经卷起来了。

      你伸手，把它撕了下来，在手里团成一团。'
    choices:
    - text: 把辞职信拍在经理桌上——这格子间，装不下你了
      if: flags.cubicle.spoke  or  flags.cubicle.dare  or  flags.cubicle.said  or  flags.cubicle.called
      goto: cubicle.end-quit
    - text: 把纸团扔进垃圾桶，打开电脑，继续下一周
      goto: cubicle.end-stay
  cubicle.end-quit:
    title: 结局 · 辞职
    text: '你把辞职信拍在了经理桌上。

      经理愣了愣，说"再考虑考虑"。你说，不用了。

      你抱着纸箱下楼，纸箱里是三年的东西：一个马克杯、一盆多肉、一叠没用的方案。

      走到写字楼门口，天还亮着。你忽然发现，白天的阳光，原来是这个颜色。

      手机响了，是老家母亲的消息："下班了？吃饭没有？"

      你回："今天下班早。"

      格子间的门在身后关上。你往前走了两步，又走了两步，越走越快。'
    choices:
    - text: 再走一遭这格子间
      goto: '@restart'
  cubicle.end-stay:
    title: 结局 · 留下
    text: '你把纸团扔进垃圾桶。

      下一周，照旧。晨会、午休、加班、项目会，一格一格，像打印机吐出的纸，一页跟一页。

      你偶尔还会在午休时坐到写字楼门口的台阶上，看阳光，看外卖骑手，看玻璃幕墙把天切成小块。

      老家的电话，你还是总说"一切都好"。

      那张"再忍一忍"的便签，你后来再没写过。不是不想写，是懒得撕。

      格子间很安静。安静得刚好，装得下一个不闹的人。'
    choices:
    - text: 再走一遭这格子间
      goto: '@restart'
