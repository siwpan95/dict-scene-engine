# 由 scripts/migrate/json2yaml.py 从 content/castle-pre.js 转换
# （条件表达式已转 Python 语法；业务内容原样，未人工校对）
scenes:
  castle-pre.start:
    title: 建堡 · 应招
    text: '那是很多年以前的事了。北山还没有古堡，只有一片采石场。

      言家三兄弟要在山顶建一座堡，招工匠。你背着凿子应了招。工头把你领上山时，指着山巅说："堡成之日，是言家祭剑之时。"

      祭剑？你问。工头只是摇头，说等堡成你就知道了。

      山风很大，吹得采石场的凿声都散了。你抬头望，山巅的云里，隐约有火光。'
    choices:
    - text: 跟着工头上山，看这堡怎么建
      goto: castle-pre.hub
  castle-pre.hub:
    title: 建堡 · 工地
    text: '堡建到一半，墙已高过人头。三兄弟每日都来监工，各站一边，各说各的。

      长子言伯，主张堡成之日封剑镇宅，永不开锋——"剑是凶器，封了才安"。

      次子言仲，主张铸剑开锋，悬挂门楣——"无剑不成堡"。

      三子言叔，主张毁了那柄剑——"堡要的是人，不是剑"。

      工地上的人都不敢接话。老祭师蹲在墙角，一遍遍用炭条在石上画着谁也看不懂的符。'
    choices:
    - text: 去听长子言伯说
      goto: castle-pre.first
    - text: 去听次子言仲说
      goto: castle-pre.second
    - text: 去听三子言叔说
      goto: castle-pre.third
    - text: 去问老工匠，堡基下埋着什么
      goto: castle-pre.mason
    - text: 去问老祭师，那符是什么
      goto: castle-pre.oldman
    - text: 去地基那里看看新掘出的东西
      goto: castle-pre.dig
    - text: 去铸剑坊，看次子开锋
      goto: castle-pre.forge
    - text: 去封剑台，看那剑槽
      goto: castle-pre.shrine
    - text: 下地宫，看那具石棺
      goto: castle-pre.crypt
    - text: 天黑了——三兄弟往封剑台去了
      goto: castle-pre.fork
  castle-pre.first:
    title: 建堡 · 长子
    text: '长子言伯是个端方的人，说话慢，字字都像称过。

      "剑是祖上传下来的，杀过人。"他看着你，"这堡要镇住北山的煞气，就得把这剑封进台里，压住它的锋。开了锋的剑，会找血。"

      他指着正在砌的封剑台："台里留了剑槽。封进去，浇上铁水，千年不开。"'
    choices:
    - text: （长子要封剑——镇住煞气）
      goto: castle-pre.hub
  castle-pre.second:
    title: 建堡 · 次子
    text: '次子言仲是个火爆脾气，说话像打铁。

      "没有剑的堡，算什么堡？"他拍着腰间的剑鞘，"北山上的响马，看见堡门上悬着的剑，腿先软一半。剑要开锋，要亮，要让人一眼看见！"

      他带你去看铸剑坊的炉子："这柄剑，我要亲自动手，重开一遍锋。"'
    choices:
    - text: （次子要开锋——亮剑镇人）
      goto: castle-pre.hub
  castle-pre.third:
    title: 建堡 · 三子
    text: '三子言叔年纪最小，说话轻轻的，像怕惊着谁。

      "祖上的剑，杀过太多人。"他摸着墙上的砖缝，"堡是给人住的。把一柄杀人的剑供在堡里，这堡迟早也要杀人。毁了它，一了百了。"

      他抬头看天："大哥要封，二哥要亮，我要毁。可剑只有一柄。"'
    choices:
    - text: （三子要毁剑——堡要的是人）
      goto: castle-pre.hub
  castle-pre.mason:
    title: 建堡 · 老工匠
    text: '老工匠姓何，凿了一辈子石头。他把你拉到半截墙后，压着嗓子："堡基挖到第三层，挖出东西了。"

      "三兄弟都不让声张。我偷看了一眼——是一具石棺，棺盖上刻着个怪相，像人，又像鸟。爪子抓在棺沿上，石粉落了一地。"

      他搓了搓手上的老茧："我凿石头四十年，头回见石头自己流粉的。这堡，建在什么东西上头？"'
    choices:
    - text: （堡基下的石棺——怪相如鸟）
      goto: castle-pre.hub
  castle-pre.oldman:
    title: 建堡 · 老祭师
    text: '老祭师蹲在墙角，炭条在石上画符，画一个，抹一个。

      "剑有魂。"他头也不抬，"封，它怨；开，它渴；毁，它散。三样都是错，可三样都得选一样。"

      你问他该怎么选。他停下炭条，看了你一眼："选哪样，堡就活成哪样。这符，是我替以后的堡画的——防着里头的，也防着外头的。"

      他说完，把最后一道符画完，石面上像多了只眼睛。'
    choices:
    - text: （选哪样，堡就活成哪样）
      goto: castle-pre.hub
  castle-pre.dig:
    title: 建堡 · 地基
    text: '地基挖到第三层，土里果然露着一角石棺。你趁人不注意凑近看：棺盖上刻的怪相，爪牙俱全，像人又像鸟，两只眼睛的位置是空的，像被人凿去了。

      棺缝里，插着一柄小小的银匕首，刃上泛着冷光。你伸手想拔，指尖还没碰到，匕首自己嗡地震了一下。

      你缩回手。这柄银匕首，你总觉得自己在什么地方见过——在未来的什么地方。'
    choices:
    - text: （银匕首——像在未来见过）
      goto: castle-pre.hub
  castle-pre.forge:
    title: 建堡 · 铸剑坊
    text: '铸剑坊里，炉火通红。次子言仲已经在拉风箱，剑胚在炉里烧得发白。

      "祖上的剑，我要重开锋！"他夹出剑胚，锤子落下，火星四溅。

      第三锤的时候，剑胚忽然裂了一道纹，从剑脊一直裂到剑刃。言仲愣住了。老铁匠在一旁低声道："剑有魂。它自己不愿开锋。"

      那道裂纹，正正在剑的正中——像一柄剑，要自己把自己分成两半。'
    choices:
    - text: （剑胚自裂——正中一道纹）
      goto: castle-pre.hub
  castle-pre.shrine:
    title: 建堡 · 封剑台
    text: '封剑台已经砌好，台心留着一道剑槽，深不见底。你凑近看，槽壁光滑如镜，像有什么东西常年在里头磨。

      长子言伯站在台边，手按着剑柄，脸色郑重："今夜子时，封剑。"

      风从台心灌进去，发出一声极低的响，像剑吟，又像叹息。'
    choices:
    - text: （封剑台，子时封剑）
      goto: castle-pre.hub
  castle-pre.crypt:
    title: 建堡 · 地宫
    text: '堡基的石棺已被移进地宫。你跟着抬棺的人下去，火把的光在石壁上跳。

      石棺落地时，棺盖上的怪相忽然"咔"地响了一声，像活物挪了挪。抬棺的人吓得全跑了。

      你举着火把看那怪相——石粉簌簌地落，两只空眼窝里，慢慢渗出些发亮的东西，像泪，又像鳞。'
    choices:
    - text: （石棺怪相——像要醒过来）
      goto: castle-pre.hub
  castle-pre.fork:
    title: 建堡 · 子时
    text: '子时。三兄弟站在封剑台前，剑横在当中，火光把三张脸照得通红。

      长子说封，次子说开，三子说毁。三个人争到后来，都把目光转向了你——"你也在堡里住过这些日子，你说，这剑该怎么办？"

      剑在石台上躺着，寒光流动，像也在等一句话。

      老祭师蹲在远处，炭条在石上画了最后一道符。'
    choices:
    - text: 封剑镇堡——听长子的
      goto: castle-pre.end-seal
    - text: 铸剑开锋——听次子的
      goto: castle-pre.end-split
    - text: 毁剑藏锋——听三子的
      goto: castle-pre.end-burial
  castle-pre.end-seal:
    title: 结局 · 封印
    text: '你选了封。

      剑入了槽，铁水浇下去，滋滋地响，白烟腾起来。长子亲手填上最后一块砖。

      封剑台成的那一刻，整座堡静了。风停了，凿声歇了，连火把都不再跳。那柄剑，就这么封进了石头里。

      很多年后，有旅人听说北山古堡藏着一柄失落之剑，寻剑而去。他们不知道，那剑从来没丢——它只是被封住了，等一个能让它再醒的人。

      你下山时，老祭师跟了两步，说："封住了，也还在。剑记得今天。"'
    choices:
    - text: 再走一遭这建堡的年代
      goto: '@restart'
  castle-pre.end-split:
    title: 结局 · 断剑
    text: '你选了开锋。

      次子抡起锤子，头一锤下去，剑脊那道纹"锵"地裂开了。一柄剑，生生断成两半，一半在他手里，一半崩在你脚边。

      "剑不愿开锋。"老铁匠喃喃地说，"它自己把自己折了。"

      两半断剑被收起来，封进了堡里的不同角落。三兄弟再没提过重铸。

      很多年后，有旅人在古堡里找到半截断剑。他不知道，这剑为什么是两半的。答案藏在这建堡之夜的锤声里——剑宁断，不饮血。'
    choices:
    - text: 再走一遭这建堡的年代
      goto: '@restart'
  castle-pre.end-burial:
    title: 结局 · 埋剑
    text: '你选了毁。

      三子捧起剑，一步一步走进地宫。石棺的怪相在火把里明明灭灭。他把剑放进了棺里，就在那像人又像鸟的怪相旁边。

      "跟你的冤家睡吧。"他盖上棺盖，"堡要的是活人。"

      地宫被封了。很多年后，堡里人说地下层闹鬼，夜里有人听见剑吟，还有人看见穿旧衣的管家影子。

      那柄剑到底没毁成——它只是换了个地方，继续等。等着有人把它挖出来，或者，把它重新拼上。'
    choices:
    - text: 再走一遭这建堡的年代
      goto: '@restart'
