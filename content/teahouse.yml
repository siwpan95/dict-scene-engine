# 由 scripts/migrate/json2yaml.py 从 content/teahouse.js 转换
# （条件表达式已转 Python 语法；业务内容原样，未人工校对）
scenes:
  tea.start:
    title: 茶肆 · 春雨
    text: '三年前的春天，你赶路遇上一场急雨，在城南一条老巷的尽头，撞进了一间茶肆。

      茶肆没有招牌，只门楣上悬着一块旧木板，刻着个"茶"字，笔画都叫雨润湿了。

      廊下收着几张竹桌。柜台后头站着个梳长辫的姑娘，正踮着脚擦高处的茶罐。她听见门响，回过头，眼睛先笑了："客官避雨？进来坐，茶是现成的。"'
    choices:
    - text: 进去坐下，讨碗热茶
      goto: tea.first
  tea.first:
    title: 茶肆 · 第一遇
    text: '茶是粗茶，可烫得恰到好处。你捧着碗暖手，雨在檐外下得又密又急。

      姑娘名叫阿满，一个人看这间茶肆。她说，这茶肆是她爹留下的，爹说，茶肆的茶可以赊，凳子不能空。

      "这几年，赊出去不少，收回来不多。"她给你续了碗，"可凳子没空过——总有赶路的人进来躲雨。"

      雨声里，你听见她轻轻哼一支小调，调子老，像从很远的地方漂来的。'
    choices:
    - text: 问她，这茶肆为什么没有招牌
      do:
        trust: 1
      goto: tea.first.talk
    - text: 只夸茶好，不多问
      do:
        closeness: 1
      goto: tea.first.talk
    - text: 雨小了——搁下茶钱，赶路要紧
      goto: tea.second
  tea.first.talk:
    title: 茶肆 · 夜谈
    text: '雨没有停的意思，茶肆里只剩你一个客。阿满索性把门板半掩了，搬了条板凳坐在你斜对面。

      "招牌是我爹拆的。"她拨着灯芯，"他说，认得这间茶肆的人，不靠招牌认路。"

      灯影在她脸上晃。她忽然说："客官，你信不信，有些地方，你走过一次，就还会回来？"

      你没答。雨声里，这句问话像颗种子，轻轻落下来。'
    choices:
    - text: 「信。人会回到他喝过好茶的地方。」
      do:
        trust: 1
        closeness: 1
      goto: tea.second
    - text: 「路还长，未必回得来。」
      do:
        closeness: -1
      goto: tea.second
    - text: 把茶钱搁下，雨停了，该走了
      do:
        trust: -1
      goto: tea.second
  tea.second:
    title: 茶肆 · 秋路过
    text: '第二年秋天，你又路过城南。老巷还在，茶肆还在，那块没字的旧木板还悬在门楣上。

      你站在巷口看了半晌，还是走了进去。阿满正在炉前扇火，听见门响，回过头，眼睛又先笑了："客官，又是你。"

      她居然还记得。炉上的水正开，白汽腾起来，满屋子都是茶香。'
    choices:
    - text: 坐下，说"老位置"
      goto: tea.second.talk
    - text: 在门口站一站，只说讨碗水便走
      goto: tea.third
  tea.second.talk:
    title: 茶肆 · 再坐
    text: '还是那个位置，还是粗茶。这一回，茶肆里多了两个茶客，一个下棋，一个打盹。

      阿满给你续茶时，压低声音说："这一年，赊茶的账，我都记着呢。你的那份——去年的茶钱，还没给。"

      你怔了一下，摸钱袋。她却笑了："逗你的。爹说过，躲雨的人，不赊。"

      茶客走了，日头西斜。她说起这一年的事：春天发水，冲了半条巷；巷尾的老柳树倒了，压坏了茶炉。她说得轻描淡写，像在说别人的事。'
    choices:
    - text: 「茶炉坏了，怎么不找人修？」——把身上的钱袋推过去一半
      do:
        trust: 1
        closeness: 1
      goto: tea.third
    - text: 「这茶，比去年的好。」——只夸茶
      do:
        closeness: 1
      goto: tea.third
    - text: 天色不早，起身告辞
      goto: tea.third
  tea.third:
    title: 茶肆 · 冬将关
    text: '第三年冬天，你再来的时候，巷口贴着一张红纸：铺面出让。

      茶肆的门半掩着，阿满一个人在收拾茶罐，一个一个擦干净，码进木箱里。听见门响，她没回头，只说："客官，今日只有最后一炉茶了。"

      炉火将熄。她抬起头，眼睛还是先笑，可笑里多了点什么："这茶肆，要关了。爹走了三年，我一个人，撑不动了。"'
    choices:
    - text: 坐下，陪她喝这最后一炉茶
      goto: tea.third.talk
    - text: 在门口站了站，说"那……我走了"
      goto: tea.merge
  tea.third.talk:
    title: 茶肆 · 最后一炉
    text: '最后一炉茶沏好，茶香漫出来，还是三年前那个味儿。

      你们对坐着，谁也没说话。炉火的光落在她脸上，明一下，暗一下。

      她忽然说："三年前你进来躲雨那天，我就想，这人说不定会回来。后来秋天你真回来了，我想，说不定还有第三回。"

      她笑了一下："你看，茶肆要关了，你还是回来了。"

      茶汤在碗里轻轻晃，晃出一圈一圈的影。'
    choices:
    - text: 「茶肆不能关。招牌没有，茶不能停。」
      do:
        trust: 1
        closeness: 1
      goto: tea.merge
    - text: 「关了也好。你一个姑娘家，该过轻省日子。」
      do:
        trust: 1
      goto: tea.merge
    - text: （把碗里的茶喝尽，轻轻搁下）
      do:
        closeness: 1
      goto: tea.merge
    - text: 「炉火灭了。我帮你把门板装上吧。」
      goto: tea.merge
  tea.merge:
    title: 茶肆 · 檐下
    text: '你走到檐下。巷子里的雪开始落了，一片一片，落在旧木板上那个"茶"字上。

      阿满站在门口，背后是空了一半的茶肆。炉火彻底熄了，只有一点余温，被穿堂风一卷，散了。

      三年的三回照面，像三碗茶：头一碗解渴，第二碗回甘，第三碗——苦里带着一点别的什么。

      雪越下越密。'
    choices:
    - text: 「茶肆别关了。招牌我来挂，茶你接着沏。」
      if: trust >= 2  and  closeness >= 2
      goto: tea.end-deep
    - text: 「这间茶肆，我盘下来。你还是掌柜。」
      if: trust >= 2  and  closeness < 2
      goto: tea.end-trust
    - text: 「关就关了吧。这三年，多谢你的茶。」
      if: closeness >= 2  and  trust < 2
      goto: tea.end-warm
    - text: 你点了点头，转身走进雪里
      if: trust < 2  and  closeness < 2
      goto: tea.end-miss
  tea.end-deep:
    title: 结局 · 共守
    text: '你留了下来。

      开春，你把旧门板翻新，挂上一块新匾。阿满问匾上写什么字，你想了想，说，还是不写字——"认得这间茶肆的人，不靠招牌认路。"

      她笑了，眼睛弯成月牙。

      茶肆重开那天，来了一屋子人，都是这些年赊过茶的老客。他们说，这茶肆的凳子，不能空。

      炉火天天生着。你烧水，她沏茶，巷子里的雨来了一茬又一茬。

      三年又三年。有时夜里打烊，你们并排坐在檐下，听雨打旧匾。她还会哼那支小调，调子老，可从没听腻过。

      原来信一个人，是肯把她爹的话，接过来，一起往下说。'
    choices:
    - text: 再走一遭这城南老巷
      goto: '@restart'
  tea.end-trust:
    title: 结局 · 托付
    text: '你把茶肆盘了下来。

      阿满起初不肯，你只说了一句："茶可以赊，凳子不能空。你爹的规矩，得有个人接着。"她就不说话了。

      茶肆照旧开着，阿满还是掌柜。你出钱，她出力，一年里你来不了几回——可每回进城，你都去坐坐，喝一碗粗茶。

      茶钱你从来多给。她推，你就说："躲雨的人，不赊。"

      你们之间话不多，可都算数。茶肆的账，她记得清；她的难处，你接得住。

      有些交情，不必天天见面。信了，就是一条稳稳的路，通着那间永远烧着炉火的茶肆。'
    choices:
    - text: 再走一遭这城南老巷
      goto: '@restart'
  tea.end-warm:
    title: 结局 · 温情告别
    text: '你没说挽留的话。

      茶肆关张那日，你帮着把茶罐搬上车，把旧门板卸下来，码得整整齐齐。阿满在空了的茶肆里站了很久，最后把那个"茶"字旧木板摘下来，用袖子擦了又擦。

      "这个，我带着。"她说。

      你在巷口与她作别。她走出去几步，回头朝你笑："客官，往后赶路，记得避雨。"

      后来你路过城南，老巷改成了新街，茶肆的位置起了间绸缎庄。可你总记得那三年的茶香，记得她笑起来的眼睛。

      你们没再说上话。可每次落雨，你都会想起那间茶肆——有些交情，暖过，就够了。'
    choices:
    - text: 再走一遭这城南老巷
      goto: '@restart'
  tea.end-miss:
    title: 结局 · 错过
    text: '你走了。

      雪把老巷盖了厚厚一层。你走到巷口，回头望，茶肆的门板已经装上了，那个"茶"字旧木板还悬在门楣上，被雪覆了一半。

      再后来，你路过城南，巷子拆了，茶肆没了。问起那间没招牌的茶肆，新街上的人都说不知道。

      只有一次，你在别处喝茶，听见邻座有人哼一支小调，调子很老。你抬头看，是个赶路的姑娘，梳着长辫。

      你张了张嘴，终究没问。

      有些路，走过一次，就再也回不去了。有些茶，喝过三碗，才明白当初那场雨，是给你留的。'
    choices:
    - text: 再走一遭这城南老巷
      goto: '@restart'
