# 由 scripts/migrate/json2yaml.py 从 content/grad.js 转换
# （条件表达式已转 Python 语法；业务内容原样，未人工校对）
scenes:
  grad.start:
    title: 毕业 · 前夜
    text: '毕业典礼是明天。今晚是你们在学校住的最后一夜。

      宿舍楼的灯一盏盏灭下去，只有走廊尽头的水房还亮着。你坐在床沿上，收拾三年来的书，一摞一摞，都旧了。

      窗外操场上，有人在放孔明灯，一点点光慢慢升上去，像把什么话带上了天。

      你口袋里揣着一张纸，写了两天，改了七遍，还没送出去。'
    choices:
    - text: 去天台吹吹风
      goto: grad.roof
    - text: 去教室，最后坐一坐
      goto: grad.classroom
  grad.roof:
    title: 天台 · 风
    text: '天台上风很大。你扶着栏杆往下看，整个校园缩在夜色里，宿舍楼、操场、食堂，都小小的。

      有人在楼下朝你挥手，看不清脸。你也挥了挥。

      三年前，你们也是在这个天台上看过一场流星雨，说了很多不着边际的话。如今那些话，都散在风里了。

      你摸到口袋里的纸，折得方方正正，像一枚要过期的邮票。'
    choices:
    - text: 把纸掏出来，展开，借着天光再读一遍
      goto: grad.letter
    - text: 塞回去——有些话，写在纸上就够了
      goto: grad.classroom
  grad.classroom:
    title: 教室 · 空座位
    text: '教室没锁门。你推开，灯也不敢开，就借着窗外路灯的光走进去。

      课桌还排得整整齐齐，黑板上还留着最后一课的板书，没擦。你找到自己的座位，坐下，椅子和三年前一样硬。

      抽屉里还有半块橡皮，和一个写了没寄出去的地址。

      你想起某个人，坐在靠窗第三排，下午的阳光落在她头发上，你偷看了三年。'
    choices:
    - text: 把那半块橡皮收进口袋，走出去
      goto: grad.gate
  grad.letter:
    title: 纸上的话
    text: '那张纸上的字，你读得比课文还熟。开头写"见字如面"，结尾写了你的名字，中间的话，删了又写，写了又删，最后只剩三行。

      你说，明天之后，大家就散了。你说，谢谢她帮你打过的水、借过的笔记。你说，如果还有机会，还想和她坐一次同桌。

      第三行后面，空着一大块——像一句话，站在纸边上，始终没敢迈出来。

      天台的孔明灯又升起来一盏。你的影子投在纸上，长长的。'
    choices:
    - text: 把纸折好，明天亲手给她
      do:
        flags.grad.said: true
      goto: grad.gate
    - text: 把纸撕了，扔进风里
      goto: grad.gate
  grad.gate:
    title: 校门 · 天快亮
    text: '你走到校门口。天边泛白了。

      卖早点的摊子刚支起来，蒸笼冒热气。校工打开铁门，吱呀一声，像给这三年画了道缝。

      陆陆续续有早起的同学走出来，拖着行李箱，往不同的方向去。你站在这头，忽然分不清，是他们在离开，还是你在离开。'
    choices:
    - text: 毕业典礼——到最后，那句话说没说
      goto: grad.merge
  grad.merge:
    title: 典礼 · 散场
    text: '毕业典礼结束了。校长在台上讲了很多话，你一句没记住。只记得散场时，满操场的帽子飞上天，落下来，像一场下了三年的雨，终于停了。

      人群往校门涌。你在人缝里找那个靠窗第三排的身影，找到了，又挪开了眼。

      口袋里的东西还在。典礼散场，各奔东西——这是最后的机会了。'
    choices:
    - text: 追上去，把纸递给她，把没说完的话说完
      if: flags.grad.said
      goto: grad.end-say
    - text: 站在原地，看她的背影消失在人群里
      if: not flags.grad.said
      goto: grad.end-hide
  grad.end-say:
    title: 结局 · 说出口
    text: '你追了上去。

      她回过头，愣了一下，然后笑了。那张纸在她手里展开，三行字，她读得很慢。

      "第三行后面空着，是留给我问的吗？"她问。

      你点头，喉咙发紧，可到底说出了那句话。风把操场上的彩带吹起来，满天的彩色，像谁在天上放了一串小小的烟花。

      很多年后，那张纸还夹在她的书里，折得方方正正。

      你一直记得那天的风，记得自己跑过半个操场时，心跳得像鼓。有些话，说出口，一辈子都不后悔。'
    choices:
    - text: 再走一遭这毕业的前夜
      goto: '@restart'
  grad.end-hide:
    title: 结局 · 没说出
    text: '你站在原地，看她的背影消失在人群里。

      那半块橡皮在口袋里，被你的手汗浸得发软。你没追。

      后来你们再没见过。同学聚会你去了两次，她都没来。有人说她去了南方，有人说她结婚了。

      你每次路过母校，都会在门口站一会儿。教室的灯还亮着，靠窗第三排，总坐着别的什么人。

      那张纸，你早撕了。可纸上的三行字，你一个字也没忘。

      有些话，咽下去，就是一辈子。青春里最重的东西，往往是最轻的那张纸。'
    choices:
    - text: 再走一遭这毕业的前夜
      goto: '@restart'
