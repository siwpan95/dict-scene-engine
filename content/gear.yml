# 由 scripts/migrate/json2yaml.py 从 content/gear.js 转换
# （条件表达式已转 Python 语法；业务内容原样，未人工校对）
scenes:
  gear.start:
    title: 山道 · 机巧阁
    text: '你听山里的采药人说，后山深处有一座机巧阁，是鲁班传人留下的机关楼。楼里锁着一册《天工手记》，谁解开了全楼的机关，手记就归谁。

      你走了半日山路，果然在雾里望见一座木楼，三层，檐角挂着生锈的铜铃。楼门紧闭，门上一把没有锁眼的锁——锁上嵌着一块活动的木格。

      山风过，铜铃响，像有人在楼里敲。'
    choices:
    - text: 凑近那扇楼门，看那把无眼锁
      goto: gear.gate
  gear.gate:
    title: 机巧阁 · 楼门
    text: '无眼锁是一块整木，正面刻着九宫格，格子能滑动，却推不动——原来每格背面都咬着木楔。

      你在门槛下找到一块磨圆的木楔，大小正合锁侧一个缺口。把楔子插进去，九宫格"咔"地松了。

      这锁的规矩：九宫格要排成"三三相连"，像鲁班尺上的星位。你试着推了一格——格下的铜簧响了一声，轻而脆。'
    choices:
    - text: 把九宫格排成三三相连（得楔子开锁）
      if: not items.gear_wedge
      do:
        items.gear_wedge: 1
      goto: gear.gate.open
    - text: 试着强掰——木格"啪"地弹回，磕了你的手
      do:
        hp: -2
      goto: gear.gate
  gear.gate.open:
    title: 机巧阁 · 门开
    text: '九宫格排成星位，无眼锁应声而开。楼门往里退去，一股陈年的木香扑出来。

      一层大厅里，正当中立着一座石转盘，盘面刻着水纹；四壁的架子上，摆满小件的机关兽，铜的、木的，各自缺了零件。

      楼梯口拦着一道栅门，门闩处嵌着一个齿轮槽——空的，正等你安上什么。'
    onEnter:
      items.gear_wedge: -1
    choices:
    - text: 去转那座石转盘
      goto: gear.wheel
    - text: 去翻四壁的架子
      goto: gear.hall
  gear.wheel:
    title: 机巧阁 · 一层转盘
    text: '石转盘刻着水纹，盘心有个方孔。你试着推，盘纹丝不动——方孔里还缺个轴。

      你想起楼门那把无眼锁：这楼的机关，环环相扣，一样东西解一样。

      盘座边有块松动的石条。你把它抠开，石条下压着一枚铜齿轮，齿上还带着油。'
    choices:
    - text: 拾起铜齿轮（得齿轮）
      if: not items.gear_gear
      do:
        items.gear_gear: 1
      goto: gear.hall
    - text: 先去翻架子
      goto: gear.hall
  gear.hall:
    title: 机巧阁 · 一层大厅
    text: '架子上都是些缺零件的机关兽：铜鹤少了翅，木鸟少了簧，铁龟少了盖。每只底座下都压着一张字条，写的是鲁班尺的口诀，什么"三分留一""逢五进一"。

      你把字条都看了一遍，心里隐约有了数：这楼里的机关，全是按鲁班尺的寸法布的。

      楼梯口的栅门还拦着，齿轮槽空空的。'
    choices:
    - text: 把铜齿轮装进楼梯口的槽里
      if: items.gear_gear >= 1
      do:
        items.gear_gear: -1
      goto: gear.stairs
    - text: 再转转那石盘
      if: not items.gear_gear
      goto: gear.wheel
    - text: 门在身后——现在退，还来得及
      goto: gear.end-leave
  gear.stairs:
    title: 机巧阁 · 楼梯
    text: '铜齿轮"咔哒"一声落进槽里。你转动齿轮，栅门缓缓升起，楼梯露了出来。

      楼梯是空的，踩上去却稳。你上了二层，回头望，一层的机关兽在昏暗里列成两排，像在送行。楼外的铜铃又响了一声，从下到上，一层层递上来，像这楼在数你的步子。'
    choices:
    - text: 上二层
      goto: gear.hall2
  gear.hall2:
    title: 机巧阁 · 二层
    text: '二层没有架子，四面墙上全是齿轮，大的套小的，咬成一座阵。齿轮阵缓缓转着，声音很轻，像整座楼在呼吸。

      阵心有一枚黄铜机簧，被八个小齿轮卡着。你想取，手刚伸过去，齿轮忽然加速，把你逼退一步。

      墙脚刻着一行字："取簧者，先停东三。"'
    choices:
    - text: 按刻字，先停东三的齿轮，再取机簧
      if: not items.gear_spring
      do:
        items.gear_spring: 1
      goto: gear.clock
    - text: 硬伸手去够——齿轮咬住了你的袖口
      do:
        hp: -3
      goto: gear.hall2
  gear.clock:
    title: 机巧阁 · 水漏
    text: '二层尽头是一架铜水漏，滴滴答答，漏了不知多少年，铜斗里的水竟还是满的。

      水漏的转轴上缺一根玉轴——轴槽的形状，和墙上一幅图里画的一模一样。图下有个小抽屉，锁着。锁上刻着"漏满三刻"。

      你盯着水漏看了一会儿：铜斗每隔一会儿就倾一下，倾到第三下，抽屉"嗒"地开了。'
    choices:
    - text: 等三刻，开抽屉取玉轴（得玉轴）
      if: not items.gear_axle
      do:
        items.gear_axle: 1
      goto: gear.top
    - text: 不等了，直接上顶层看看
      goto: gear.top
  gear.top:
    title: 机巧阁 · 顶层天工匣
    text: '顶层只有一口天工匣，乌沉沉的，搁在正中的木台上。匣上没有锁，只两个凹槽：一个槽是簧形，一个槽是轴形。

      匣盖上刻着四个字："机巧有度"。台边的铜灯自己亮着，火光青白，照得匣子像在呼吸。

      你把身上的东西掂了掂——还缺什么，心里有数。'
    choices:
    - text: 把机簧和玉轴嵌进凹槽，开匣
      if: items.gear_spring >= 1  and  items.gear_axle >= 1
      goto: gear.end-open
    - text: 手边缺零件——硬撬那匣子
      goto: gear.end-ruin
    - text: 这楼太静了——下山去吧
      goto: gear.end-leave
  gear.end-open:
    title: 结局 · 天工开匣
    text: '机簧与玉轴嵌进凹槽，天工匣"咔"地一声，盖子弹开了。

      里头是一册手记，纸页泛黄，字却是新的——鲁班尺的寸法、机关兽的图样、九宫锁的解法，一页一页，工工整整。

      末页有一行字："楼中诸器，皆为试人心。急者失手，慎者得之。得之者，莫以巧伤人。"

      你把手记收进怀里，下楼。走到一层，那些机关兽忽然齐齐转了过来，像在列队送你。

      你出楼时，山雾散了。机巧阁立在日光里，檐角的铜铃响了一声，又一声，像在道别。

      巧可以学，度不可失——这是这楼用三年机关，教给你的一句话。'
    choices:
    - text: 再走一遭这机巧阁
      goto: '@restart'
  gear.end-ruin:
    title: 结局 · 机关反噬
    text: '你撬了那匣子。

      "嗡"的一声，整座楼都活了：墙上的齿轮疯转，铜铃乱响，一层的机关兽从架子上跃下来，堵住了楼梯。你抱着天工匣想跑，可匣子烫得像炭，脱手砸在地上，盖子弹开——里头是空的。

      "急者失手。"墙上的字在火光里明灭。

      楼板开始下陷。你从二层窗口翻出去，摔在半山腰的草丛里，回头望，机巧阁已经陷进地底，只剩檐角一截，在土里慢慢沉下去。

      你的手上，还留着撬匣子的口子。

      巧能通神，急能招祸。这楼，你到底是白来了。'
    choices:
    - text: 再走一遭这机巧阁
      goto: '@restart'
  gear.end-leave:
    title: 结局 · 知难而退
    text: '你退了出来。

      楼门在身后合上，无眼锁"咔"地锁回。你站在山道上回头望，机巧阁立在雾里，三层楼，檐角铜铃轻响。

      有些楼，不必强上。那本《天工手记》，也许还在匣子里等着，等一个更沉得住气的人。

      你下山时，采药人问你上去了没有。你摇摇头。他笑了："上去的人多，下来的人少。你还能下来，就是本事。"

      山风从楼里吹出来，带着一股陈年的木香。像这楼在说：来日方长。'
    choices:
    - text: 再走一遭这机巧阁
      goto: '@restart'
