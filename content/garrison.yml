# 由 scripts/migrate/json2yaml.py 从 content/garrison.js 转换
# （条件表达式已转 Python 语法；业务内容原样，未人工校对）
scenes:
  garrison.start:
    title: 边塞 · 夜
    text: '你叫周二郎，戍边三年。今夜轮到你守更，烽火台上的风刮得人睁不开眼。

      你怀里有一封家书，是你媳妇托同乡捎来的，皮纸磨得起了毛，你贴身揣了三年。三年里，这封信你念过一千遍，每一个字都认识；可今夜再摸出来，纸角上还裹着半块硬得像石头的干粮——上个月断粮，你把信纸拆了一角，垫过锅。

      风里传来远处的胡笳声。你攥着那封信，听见营里同袍喊你的名字。'
    onEnter:
      items.letter: 1
    choices:
    - text: 先看眼前——去烽火台，同袍在喊
      do:
        flags.garrison.chap: record
      goto: garrison.hub.record
    - text: 先念家书——借着烽火的光，把信展开
      do:
        flags.garrison.chap: memory
      goto: garrison.hub.memory
  garrison.hub.record:
    title: 戍堡 · 眼前
    text: '戍堡很小，一圈土墙圈着几十号人。烽火台在堡后最高处，台上三堆狼粪，一堆已燃——胡骑犯边，两日内必至。

      你站在堡墙上往下看，黑压压的戈壁一眼望不到头。远处胡骑的游哨点着火把，像撒在荒原上的火星。同袍们各自忙各自的：磨刀的、补甲的、往水井里系绳子的。

      该做什么，你自己拿主意。'
    choices:
    - text: 去烽火台，看胡骑的动静
      goto: garrison.record.beacon
    - text: 去堡墙，巡一圈城防
      goto: garrison.record.wall
    - text: 去看看中箭的同袍王七
      goto: garrison.record.comrade
    - text: 去看看水井——听说井快见底了
      goto: garrison.record.water
    - text: 去中军帐，听突围之议
      goto: garrison.record.breakout
    - text: 入夜了——胡骑的火光近了，上墙迎战
      goto: garrison.record.night
    - text: 心里乱得很——把家书摸出来，再念一念
      if: items.letter >= 1
      do:
        flags.garrison.chap: memory
      goto: garrison.hub.memory
    - text: 两篇都走过了——天快亮了，去堡门看
      if: flags.garrison.recordDone  and  flags.garrison.memoryDone
      goto: garrison.merge
  garrison.record.beacon:
    title: 烽火台 · 狼烟
    text: '烽火台上风最大，三堆狼粪已经点着两堆。你按着刀柄朝北望，戈壁尽头，胡骑的游哨像鬼火一样游荡，比昨日又近了三里。

      老卒说，狼烟三堆，是十万火急——援军就算拔营，赶到也要五日。可堡里的粮，只够吃四天。

      "他们不进犯便罢，进犯，就是这一两日的事。"老卒往狼粪上浇了把马粪，烟更浓了，直直地往天上戳，"周二郎，你媳妇的信，揣好喽。"'
    choices:
    - text: （狼烟三堆，粮只四日——这仗近了）
      goto: garrison.hub.record
  garrison.record.wall:
    title: 堡墙 · 巡城
    text: '巡城的路你走了三年，闭着眼都知道哪块砖松了。今夜风大，你挨着垛口走，手指在砖缝里一个一个摸过去——西北角那一段，去年修补的泥皮已经剥落，露出了里面的土。

      守墙的老卒拄着枪打盹，你替他紧了紧披风。他梦见什么了，嘴里嘟囔着"麦子熟了"。

      堡墙外，胡骑的篝火连成一线。你知道，他们今夜不会来——他们要等风停，等天亮，等最合适的时候。'
    choices:
    - text: （记下西北角的缺口——真打起来，那里最险）
      do:
        flags.garrison.sawGap: true
      goto: garrison.hub.record
  garrison.record.comrade:
    title: 伤兵营 · 王七
    text: '王七是同乡，一起入伍的。前天夜哨，他替人挡了一箭，箭头没起干净，如今躺在床上，烧得说胡话。

      他攥着你的手，手烫得吓人："二郎……你说，援军还来吗？我要是回不去了，我娘……"

      营里没有药。唯一的一包金疮药，昨天给了旗总。你坐在他床边，忽然想起家乡的赤脚郎中——那郎中的药铺，就在你家隔壁，你媳妇常去赊药。

      王七烧糊涂了，开始背他娘教他的童谣。'
    choices:
    - text: （把怀里最后一包干粮掰碎，就着水喂他）
      goto: garrison.hub.record
  garrison.record.water:
    title: 水井 · 见底
    text: '水井见底了。你抓着井绳往下看，井底只剩一汪发绿的浅水，映着半张脸。打上来的水混着泥，得拿布滤三遍才能喝。

      伙夫说，照这么下去，两日后一人一天只分得半碗。马已经两天没饮水了，军马瘦得能数出肋条。

      你蹲在井边，用刀背刮下刃上结的霜，放进嘴里。霜化在舌头上，凉，可解不了渴。

      你想起家乡的井——那口井的水，是甜的。'
    choices:
    - text: （水不多了——这城，守得住吗）
      goto: garrison.hub.record
  garrison.record.breakout:
    title: 中军帐 · 突围之议
    text: '中军帐里，旗总和几个百夫长在议事。地图摊在案上，油灯的火苗跳着，把他们的脸映得忽明忽暗。

      "死守，援军五日必至。"旗总说。

      "五日？粮只四天，水两日——守不到。"一个百夫长把刀往图上一拍，"趁夜突围，冲出去一个是一个。"

      "突围就是弃城。弃城，就是弃了后头三百里的百姓。"

      两人吵起来。你站在帐外听，风把话吹得断断续续。旗总忽然叫你："周二郎，你是老兵，你说。"

      你张了张嘴，没说出话。'
    choices:
    - text: （你心里也没底——这城，是守是走）
      goto: garrison.hub.record
  garrison.record.night:
    title: 夜战 · 最后的冲锋
    text: '当夜，胡骑来了。

      火光从北边漫过来，像烧荒的野火。你握紧刀，站在西北角的缺口上——那缺口你白天记过，此刻砖缝里灌进来的风，冷得像刀子。

      同袍们在身边倒下，又有人补上来。王七拖着伤腿也上了墙，他娘教的童谣，混在喊杀声里。

      你杀红了眼。天快亮时，你听见旗总在喊：还能动的，往南门集合——突围！

      可你回头看了一眼堡里的水井、伤兵营，还有那间堆着粮的仓房。你想起家书里那句"等你回家"。

      南门还是西门，你只有一瞬。'
    choices:
    - text: 死守——你转身回了西北角的缺口
      do:
        flags.garrison.hold: true
        flags.garrison.recordDone: true
      goto: garrison.hub.record
    - text: 突围——你跟着旗总往南门冲
      do:
        flags.garrison.break: true
        flags.garrison.recordDone: true
      goto: garrison.hub.record
    - text: 城破了——你被潮水一样的胡骑吞没
      do:
        flags.garrison.fall: true
        flags.garrison.recordDone: true
      goto: garrison.hub.record
  garrison.hub.memory:
    title: 烽火下 · 念信
    text: '你借着烽火的光，把家书展开。信纸的毛边被你磨了三年的指腹抚平了，字是歪歪扭扭的，是你媳妇托村里教书先生写的。

      "二郎见字如面。家里都好，你莫挂念。春上麦子长得旺，爹的咳嗽比去年轻了。小拴儿会叫爹了，整日站在门口朝北望……"

      烽火把信纸映得发红。你一个字一个字看下去，看到最后，纸上洇开一小团——像是写字的人，写到那儿停了一下。'
    choices:
    - text: 念那句"小拴儿会叫爹了"
      goto: garrison.memory.wife
    - text: 念那句"你何时回来"
      goto: garrison.memory.late
    - text: 念那句"地里的活，我能干"
      goto: garrison.memory.field
    - text: 听同乡捎来的口信
      goto: garrison.memory.neighbor
    - text: 信纸角上，还有半张没写完的
      goto: garrison.memory.farewell
    - text: 把信折好揣回去——回到眼前
      do:
        flags.garrison.chap: record
      goto: garrison.hub.record
  garrison.memory.wife:
    title: 家书 · 小拴儿
    text: '"小拴儿会叫爹了。"

      她写，孩子整日站在门口朝北望，见着赶路的军爷就喊"爹"。喊错了不知多少回，后来村里的孩子都笑他。

      "我跟他说，你爹在很远很远的北边，替朝廷守边呢。他就往北边跑，跑到村口的老槐树下，站到天黑。"

      你记得走那年的小拴儿，还抱在怀里，软软的一小团，哭声像猫。如今会叫爹了。

      "他问我，爹什么时候回来。我说，等北边的雪化了，爹就回来了。"

      雪化了又下，下了又化，三年了。'
    choices:
    - text: （手指在"小拴儿"三个字上停了很久）
      goto: garrison.hub.memory
  garrison.memory.late:
    title: 家书 · 归期
    text: '"你何时回来？"

      这五个字在信里只问了一句，你却读了三年。

      她写，隔壁王七家也来信了，王七他娘眼睛不好，托人念信，念到"儿好勿念"，老太太就哭。

      "村里的男丁走了大半，剩下的不是太老，就是太小。村口的官道上，天天有征兵的人过。"

      她没写自己怎么熬。她只写，你若是今年回不来，明年回不来，她也等着。

      "路远，你莫急。家里的事，有我。"

      可你比谁都清楚——戍边的兵，十个有八个，回不去。'
    choices:
    - text: （归期？你自己都不知道归期是哪一年）
      goto: garrison.hub.memory
  garrison.memory.field:
    title: 家书 · 田里
    text: '"地里的活，我能干。"

      她写，春耕是她一个人扶的犁，小拴儿坐在田埂上揪草玩。麦子种下去，一场雨没下，她挑水浇地，肩膀磨出血。

      "邻居二婶子说我逞强。可地不种，来年吃什么？你在外头吃军粮，家里不能饿着爹和小拴儿。"

      你想起离家那年，麦田刚返青，你扶犁的手上全是新茧。如今那些茧，怕都长在她手上了。

      她写："今年收成还好，留了种，剩下的粜了，给你攒着。"

      你给她攒的钱，她一分没动，全给你攒着。'
    choices:
    - text: （田里的活，本该是你干的）
      goto: garrison.hub.memory
  garrison.memory.neighbor:
    title: 口信 · 邻人
    text: '同乡说，你媳妇过得苦。

      王七他娘眼睛不好，你媳妇三天两头去帮着挑水；你家那两亩田，是她一个人种；到了夜里，村里人都歇了，她还坐在灯下纳鞋底，纳完了托人往北捎——怕你在边塞冻脚。

      "有一回发大水，冲了她半亩地。她在田里站到天黑，第二天照旧下地。"同乡叹了口气，"全村人都说，周家的媳妇，是个铁打的人。"

      你听完，半天没说话。铁打的人？你比谁都清楚，她怕冷、怕黑、怕打雷。'
    choices:
    - text: （她怕冷，却把鞋底纳给你御寒）
      goto: garrison.hub.memory
  garrison.memory.farewell:
    title: 家书 · 诀别
    text: '信纸的角上，还有半张没写完的。

      那是同乡后来才发现的——你媳妇本来要写第二页，写了两行，又撕了。撕剩的这角上，还能看出几个字："二郎，你若有日——"

      "你若有日"什么？是"回来"，还是"回不来"？还是别的？字迹到这儿断了，纸角的毛边还带着指甲掐过的印。

      你把这半页纸举到烽火前。火光透过来，那几个字像要烧起来。

      该把它留好，还是烧了？'
    choices:
    - text: 留好——把半页纸折进怀里，和整封家书放在一起
      do:
        flags.garrison.keep: true
        flags.garrison.memoryDone: true
      goto: garrison.hub.memory
    - text: 烧了——把半页纸凑到火上，看它化成灰
      do:
        flags.garrison.burn: true
        flags.garrison.memoryDone: true
      goto: garrison.hub.memory
  garrison.merge:
    title: 堡门 · 天明
    text: '天快亮了。你站在堡门口，怀里揣着那封家书，背后的堡墙上还插着断箭。

      这一夜，你把该看的人和事都看了一遍，也把该念的话都念了一遍。眼前是戈壁，背后是故土；一封信，把两边缝在了一起。

      旗总在点兵，王七在城墙上朝你招手。你摸了摸怀里——家书还在，还温着。

      风从北边来，吹得烽火台上的狼烟散了又起。'
    choices:
    - text: 死守到底——你攥紧家书，转身回了墙上
      if: flags.garrison.hold  and  flags.garrison.keep
      goto: garrison.end-hold
    - text: 突围——你最后回头望了一眼，往南去了
      if: flags.garrison.break
      goto: garrison.end-home
    - text: 城破——火光吞没了戍堡
      if: flags.garrison.fall
      goto: garrison.end-fall
    - text: 信烧了——灰从指缝漏进风里
      if: flags.garrison.burn
      goto: garrison.end-ash
  garrison.end-hold:
    title: 结局 · 死守
    text: '你回了墙上。家书揣在怀里，贴着心口，被汗浸透，又被风吹干。

      胡骑的箭雨遮天蔽日地来，同袍一个接一个倒下。王七靠在垛口上，朝你笑了一下，就不动了。你拔掉肩上的箭，把家书往怀里按了按，接着砍。

      援军赶到那天，戍堡还立着，堡门没破。旗总阵亡了，活下来的人不到二十个。

      你瘫坐在堡墙上，掏出家书——纸被血洇红了大半，字还认得："家里都好，你莫挂念。"

      后来，朝廷嘉奖戍堡。你把赏银全托人捎回家，自己在堡上多留了一年。雪化的时候，有人看见你对着北边站了很久。

      死守的人，总得替活着的把话带到。你把家书又念了一遍——这一遍，是念给王七听的。'
    choices:
    - text: 再走一遭这戍堡
      goto: '@restart'
  garrison.end-home:
    title: 结局 · 归乡
    text: '你跟着旗总从南门冲出去。刀卷了刃，马没了，跑丢了鞋，天快亮时，你成了冲出来的人里活着的一个。

      三个月后，你回了村。麦子正返青，村口的老槐树下，一个孩子朝你跑来，边跑边喊："爹！爹回来了！"

      小拴儿长高了，会叫爹了，叫得又脆又响。你媳妇从田里直起腰，手里的锄头"当啷"掉在地上。

      你从怀里掏出那封血洇过的家书。她接过去，一个字一个字地看，看到"小拴儿会叫爹了"，眼泪砸在纸背上。

      "你若有日——"她忽然说，"我本来想写，你若有日回来了，咱就把地里的麦子都粜了，给你扯身新衣裳。"

      雪化了。北边的雪，这回是真的化了。'
    choices:
    - text: 再走一遭这戍堡
      goto: '@restart'
  garrison.end-fall:
    title: 结局 · 城破
    text: '火光吞没了戍堡。你被潮水一样的胡骑冲散，刀折了，人倒在血泊里。

      弥留之际，你听见钟鼓楼上的号角——那是城破的信号。戍堡没了，三百里的百姓，怕是要遭殃。

      你挣扎着想爬起来，手却先摸到了怀里的家书。信纸已经被血浸透，几个字化开，成了红糊糊的一团。

      你想起她写的那句"等你回家"。到底没能回去。

      风从北边来，卷着灰烬和旗。天快亮的时候，你听见了马蹄声，分不清是胡骑，还是做梦。

      有些城，破了就破了；有些人，等了就等了。你闭上眼，攥着那封信，攥得很紧，像攥着三年前那个出村口时回头的早晨。'
    choices:
    - text: 再走一遭这戍堡
      goto: '@restart'
  garrison.end-ash:
    title: 结局 · 灰烬
    text: '你把半页纸凑到火上。纸角卷起来，那几个字——"你若有日"——在火里亮了一下，就化成了灰。

      灰从你指缝漏进风里，被北风一卷，散在戈壁上。

      后来，戍堡守住了，援军来了，你也活着。可那半页纸没了。剩下的家书还在，只是缺了一个角——像你那三年，缺了一个说法。

      多年后你回了村。小拴儿认你，你媳妇也认你。可有些夜里，你坐在门槛上，总想把那半页纸想回来——她到底想写什么？

      "你若有日"什么？你问过她，她只说忘了。

      可你看见她的眼神——不是忘了，是不想说。有些话，写出来就轻了；烧了，才重。灰烬会散，重字会沉，沉在两个人心里，一辈子。'
    choices:
    - text: 再走一遭这戍堡
      goto: '@restart'
