# 由 scripts/migrate/json2yaml.py 从 content/ferry.js 转换
# （条件表达式已转 Python 语法；业务内容原样，未人工校对）
scenes:
  ferry.start:
    title: 渡口 · 雾起
    text: '你赶到江边野渡时，雾正从江心漫上来。

      一条旧船横在渡口，船头立着个老渡工，正把缆绳一圈一圈盘起来。渡亭的柱子上贴着一张发黄的纸，写的是"摆渡：一文一位，夜渡两文"。

      老渡工回头看了你一眼，嗓门沙得像船底磨过沙："客官来得巧。今日渡口，是要送四个过客。"

      四个？你望了望，渡口空空荡荡，除了雾，什么也没有。'
    choices:
    - text: 问老渡工，那四个过客是谁
      goto: ferry.boatman
    - text: 先去渡亭里避雾
      goto: ferry.pavilion
  ferry.boatman:
    title: 渡口 · 老渡工
    text: '老渡工姓谈，在渡口摆渡了一甲子。他手上的缆绳盘了又散，散了又盘，像一辈子的日子都缠在这条船上。

      "四个过客，"他眯起眼看江，"春渡一个，夏汛一个，秋枯一个，冬冰一个。都在来的路上。"

      你问他，这四个人要渡什么。他笑了笑，露出几颗黄牙："渡江呗。可这条江，渡的不是脚，是人心里那道坎。"

      他不再说，只把船篙往水里一撑。雾浓起来，把对岸吞了。'
    choices:
    - text: 去四时碑看看
      goto: ferry.stele
    - text: 去栈桥等那四个过客
      goto: ferry.pier
  ferry.stele:
    title: 渡口 · 四时碑
    text: '渡亭后头立着一块青石碑，刻着四个字：春渡、夏汛、秋枯、冬冰。

      碑上的字已经被江风磨得圆了，可每行字底下，还刻着些小字，是历年来过江的人留的。你用袖子擦去青苔，凑近看：

      "甲子年春，有人在此等了三日，船来，人未上船。"

      "庚午年夏，水涨，一船货沉在江心，船主疯了。"

      "乙酉年秋，画箱过江，画箱的主人没过。"

      "辛丑年冬，一书生过江赴考，再没回来。"

      碑的背面，还有一行更小的字，被磨得几乎看不见了。'
    choices:
    - text: 记下碑上的四行字
      do:
        ferryClues.stele: 1
      goto: ferry.pier
  ferry.pier:
    title: 渡口 · 栈桥
    text: '栈桥伸进江里，木板被雾打湿了，走上去咯吱咯吱响。

      你走到桥头，江风吹得人一激灵。雾里，江水的声音时远时近，像有什么人踩着水往这边走。

      老渡工的声音从身后传来："来了。春渡的，到了。"

      你回头，栈桥那一头，果然站着一个人。'
    choices:
    - text: 迎上去，看那春渡的过客
      goto: ferry.spring
  ferry.spring:
    title: 春渡 · 过客
    text: '春渡的过客是个三十来岁的汉子，背着个旧包袱，腰上挂着把空剑鞘，风尘仆仆，像走了很远的路。

      他在栈桥头站定，望了望对岸，又望了望你，忽然笑了："这位兄弟，也是过江的？"

      老渡工在船头应声："春渡的客，上船吧。"

      汉子没动，只把剑鞘解下来，在手里摩挲着。那剑鞘是空的。'
    choices:
    - text: 问他剑的事
      goto: ferry.spring.guest
    - text: 先在栈桥上，听他说完
      goto: ferry.spring.ask
  ferry.spring.guest:
    title: 春渡 · 空剑鞘
    text: '汉子姓程，是个寻剑的。他听说北山古堡里藏着一柄失落之剑，寻去，在古堡里转了三日。

      "石像鬼守着圣所，剑就在圣所里。"他摩挲着空剑鞘，"我到了圣所门口，听见里头有剑吟——可我到底没敢推那扇门。"

      你问他为什么。他望着江面，很久才说："我寻剑十年，寻的不是剑，是心里那点不敢认的怯。真到了剑跟前，我才明白——我怕的不是石像鬼，是拿到剑以后，还得做那个拿剑的人。"'
    onEnter:
      ferryClues.spring: 1
    choices:
    - text: 拉着他细说
      goto: ferry.spring.ask
    - text: 听他讲古堡的往事
      goto: ferry.spring.past
    - text: 记下空剑鞘——去夏汛
      goto: ferry.summer
  ferry.spring.ask:
    title: 春渡 · 寻剑客
    text: '程姓汉子坐在栈桥边，把空剑鞘横在膝上。江风吹着他额前散下来的头发，一绺一绺的。

      "这江，我十年前就该渡。对岸有个人等我。"他顿了顿，"我总想着，寻到剑，体体面面地过去。可剑没寻到，十年过去了。"

      他抬头看你："客官要问什么，问吧。过了这渡口，这些话，我就不带了。"'
    mode: dialogue
    dialogue:
      npc: 寻剑客程四
      notes: 3
      onEnd: ferry.summer
      topics:
      - id: sword
        name: 剑的下落
        reply: 剑在圣所里，还是不在？我不确定。可我确定的是，那扇门我推不动——不是没力气，是腿软。剑吟声就在门后，像在问我：你配不配。
        effect:
          ferryEvidence: 1
          ferryClues.swordQ: 1
      - id: courage
        name: 没敢推门
        reply: 怯。寻剑十年，最怯的一刻就是剑在眼前。我认了。认了，这剑鞘就轻了——装不装剑，它都是空的。
        effect:
          ferryEvidence: 1
          ferryClues.swordQ: 1
      - id: monster
        name: 古堡里的石像鬼
        reply: 石像鬼我没见着，只听见翅膀扇风的声音，还有它爪子在石阶上刮过的响。古堡那地方，进去的人十个有八个出不来。
        effect:
          ferryClues.easter1: 1
  ferry.spring.past:
    title: 春渡 · 往事
    text: '你随他的讲述，恍惚看见那座北山古堡。

      石阶千级，晨雾不散。他背着剑鞘，一级一级往上走，走到圣所门前。门里剑吟如龙，像在唤一个名字。

      他伸手，指尖离门板只有一寸。可就是这一寸，隔了十年。

      他听见自己的心跳，比剑吟还响。后来他转身下了山，一路走到这座渡口——空剑鞘还在腰间，轻轻的。'
    onEnter:
      ferryClues.pastSpring: 1
    choices:
    - text: 往事听完——去夏汛
      goto: ferry.summer
  ferry.summer:
    title: 夏汛 · 过客
    text: '夏汛的过客是个行商，赶着一头骡子，骡背上压着两个大包袱，鼓鼓囊囊的。骡子在栈桥边刨着蹄子，甩了甩耳朵。

      江水比春渡时涨了不少，混黄的水拍着栈桥，声音闷闷的。行商抹了把汗，朝你拱拱手："兄弟，这江水，今日能过吗？"'
    choices:
    - text: 问他骡背上的货
      goto: ferry.summer.trader
    - text: 拉着他细说
      goto: ferry.summer.ask
  ferry.summer.trader:
    title: 夏汛 · 压着的货
    text: '行商姓卞，原先在荒漠里跟着一支大商队走南闯北。后来商队散了伙，他分了一部分货，沿江贩到这儿，货还没脱手。

      "商队散伙那晚，营地里火堆烧着，没人说话。"他解开一个包袱角，里头是上好的绸缎，"老把头说，货可以分，路不能断。可分完货，路还是断了。"

      他从怀里摸出一样东西，黄澄澄的，是个铜符："这是石堡里带出来的老物件。三合铺的何掌柜说，这东西在东市能卖三十金。我没卖。"'
    onEnter:
      ferryClues.summer: 1
    choices:
    - text: 拉着他细说
      goto: ferry.summer.ask
    - text: 听他讲商道的往事
      goto: ferry.summer.past
    - text: 记下压着的货——去秋枯
      goto: ferry.autumn
  ferry.summer.ask:
    title: 夏汛 · 行商
    text: '卞行商把骡子拴在栈桥边，拍了拍骡背上的货，叹了口气。江水涨着，眼看就要漫上桥面。骡子打了个响鼻，像催他快走。

      "过了江，这货能卖。可卖完了呢？再贩，再走，再散伙？"他抹了把脸，"我走商道十五年，最怕的不是沙盗，是走到最后，不知道这条路还是不是我的。"'
    mode: dialogue
    dialogue:
      npc: 行商卞六
      notes: 3
      onEnd: ferry.autumn
      topics:
      - id: cargo
        name: 骡背上的货
        reply: 半是绸缎半是药材。压了半个月了，价一天跌一点。再不脱手，就得折本。可折了本，我拿什么回去见分货的老弟兄？
        effect:
          ferryEvidence: 1
          ferryClues.trailQ: 1
      - id: partnership
        name: 商队散伙
        reply: 老把头带人走北线，我走南线。说好三年后在东市会合。如今三年到了，我连东市的城门都不敢望。
        effect:
          ferryEvidence: 1
          ferryClues.trailQ: 1
      - id: charm
        name: 那枚铜符
        reply: 石堡里的老物件，带着能辟邪。三合铺何掌柜出三十金，我没卖——老把头说，行商可以没货，不能没个念想。
        effect:
          ferryClues.easter2: 1
  ferry.summer.past:
    title: 夏汛 · 往事
    text: '你随他的讲述，恍惚看见那片荒漠。

      驼铃一串，商队从沙丘后头绕出来。火堆边，老把头把一张古商道图铺在沙地上，用烟锅指着东边："东市，三年。"

      后来驼队散了，图还在，人各奔东西。他把图折好揣进怀里，和那枚铜符放在一起。

      夜里起风，沙打在脸上，像一群细小的刀子。'
    onEnter:
      ferryClues.pastSummer: 1
    choices:
    - text: 往事听完——去秋枯
      goto: ferry.autumn
  ferry.autumn:
    title: 秋枯 · 过客
    text: '秋枯的过客是个年轻人，背着个旧画箱，箱角磕破了一块，用布条缠着。他站在栈桥头，望了望江，又望了望你，嘴唇动了动，没说话。

      江水落了，露出两岸枯黄的芦苇。风过处，芦苇沙沙响，像在翻一本旧书。他下意识地扶了扶背上的画箱带子。'
    choices:
    - text: 问他背上的画箱
      goto: ferry.autumn.painter
    - text: 拉着他细说
      goto: ferry.autumn.ask
  ferry.autumn.painter:
    title: 秋枯 · 画箱
    text: '年轻人姓叶，是临江县画工陈砚秋的师弟。师兄死在江里，画箱他接了过来。

      "箱里是师兄没画完的堤坝图。"他解开布条，打开箱盖，里头一叠画稿，"朱笔圈着两处渗漏。师兄说，笔底下有数的，心里就有数。他心里的数，都在这些画里。"

      他小心地把画稿收好："县志的河工卷，是师兄修的。他没了，卷子没修完。我背着他的画箱过江，去府城，把图呈上去。"'
    onEnter:
      ferryClues.autumn: 1
    choices:
    - text: 拉着他细说
      goto: ferry.autumn.ask
    - text: 听他讲江畔画室的往事
      goto: ferry.autumn.past
    - text: 记下画箱——去冬冰
      goto: ferry.winter
  ferry.autumn.ask:
    title: 秋枯 · 画工之徒
    text: '叶姓年轻人把画箱放在桥板上，盘腿坐下。芦苇在风里沙沙地响，像翻书。他把画箱往怀里收了收，像护着什么。

      "师兄教我的第一课，是画一条线，得先知道水从哪边来。"他低头看着自己的手，指节上有洗不掉的颜料，"可我总学不像他——他画堤，画的是堤下的人。"'
    mode: dialogue
    dialogue:
      npc: 画工之徒叶青
      notes: 3
      onEnd: ferry.winter
      topics:
      - id: box
        name: 画箱里的图
        reply: 堤坝渗漏图，朱笔圈着两处。师兄说过，这两处不补，明年春汛还得漏。志稿上有人撕了页，补了假数——师兄就是为这个死的。
        effect:
          ferryEvidence: 1
          ferryClues.riverQ: 1
      - id: master
        name: 师兄之死
        reply: 说是失足落水。我不信。师兄水性在江边最好。我背他的画箱过江，就是想替他，把没画完的线画完。
        effect:
          ferryEvidence: 1
          ferryClues.riverQ: 1
      - id: ledger
        name: 县志与河工账
        reply: 县里的决算报八千两，堤上的实账只有七千二。那八百两，落进了谁的口袋，师兄心里有数。他死了，数还在画里。
        effect:
          ferryClues.easter3: 1
  ferry.autumn.past:
    title: 秋枯 · 往事
    text: '你随他的讲述，恍惚看见那间江边的画室。

      灯下，陈砚秋伏在案上补一幅堤坝图，笔尖的朱砂一点一点，圈住两处渗漏。师弟在旁边研墨，墨香混着江水的气味。

      "水从哪边来，线就往哪边去。"陈砚秋说，"画工的手，得比堤还稳。"

      后来画室空了。画箱还在，箱盖上的颜料结了壳，掰都掰不开。'
    onEnter:
      ferryClues.pastAutumn: 1
    choices:
    - text: 往事听完——去冬冰
      goto: ferry.winter
  ferry.winter:
    title: 冬冰 · 过客
    text: '冬冰的过客是个书生，一身洗得发白的青衫，怀里抱着一摞书，冻得嘴唇发紫。他站在栈桥头，望着封冻的江面，呵出的白气一瞬就散了。冰层底下，江水还在慢慢地流，发出极轻的响。

      "敢问……这江，可还渡得？"他声音发颤，不知是冻的，还是急的。'
    choices:
    - text: 问他怀里抱的书
      goto: ferry.winter.scholar
    - text: 拉着他细说
      goto: ferry.winter.ask
  ferry.winter.scholar:
    title: 冬冰 · 怀里的一摞书
    text: '书生姓冯，是要过江赴京赶考的。怀里的书是他十年的功课，书页卷了边，墨字却工整。

      "家里卖了猪，又借了三吊钱，凑的盘缠。"他紧了紧怀里的书，"临出门，娘塞给我一件旧棉袄，说京里冷。"

      他从书页里抽出一张发黄的报纸，是年前的："报上说，如今新学兴起，科举……怕是要停了。可我还是得去——去了，才对得起这十年。"'
    onEnter:
      ferryClues.winter: 1
    choices:
    - text: 拉着他细说
      goto: ferry.winter.ask
    - text: 听他讲乡下的往事
      goto: ferry.winter.past
    - text: 记下一摞书——去渡口枢纽，回望四时
      goto: ferry.hub
  ferry.winter.ask:
    title: 冬冰 · 书生
    text: '冯姓书生把书放在栈桥栏杆上，搓着手。江面封了冻，冰层底下，江水还在慢慢地流，发出极轻的响。他把青衫的下摆掖了掖，站得笔直。

      "过了江，就是另一个年头了。"他望着对岸，"可我怕的不是考不上——是考上了，家里那三吊钱，就更还不上了。"'
    mode: dialogue
    dialogue:
      npc: 书生冯砚
      notes: 3
      onEnd: ferry.hub
      topics:
      - id: exam
        name: 赴京赶考
        reply: 十年寒窗，就为这一场。若是科举停了，这十年算什么？可若不去，我自己都不知道这十年算什么。
        effect:
          ferryEvidence: 1
          ferryClues.letterQ: 1
      - id: letter
        name: 家书与盘缠
        reply: 娘不识字，托人写的信，说家里都好，让我莫挂念。可那三吊钱的借据，我夜夜梦见。考不考得上，这债都在。
        effect:
          ferryEvidence: 1
          ferryClues.letterQ: 1
      - id: paper
        name: 那张报纸
        reply: 年关的旧报，说新学兴起，科举要停。我把它夹在书里，日日看，像看一个赶不上的年头。
        effect:
          ferryClues.easter4: 1
  ferry.winter.past:
    title: 冬冰 · 往事
    text: '你随他的讲述，恍惚看见一间乡下的土屋。

      灯下，母亲在补一件旧棉袄，针脚密密的。书生在隔壁背书，书声琅琅，穿过纸窗，散进冬夜的雪里。

      临行那日，母亲站在村口，没说话，只把棉袄往他怀里按了按。

      他走出很远，回头，母亲还站在老槐树下，小成一个黑点。'
    onEnter:
      ferryClues.pastWinter: 1
    choices:
    - text: 往事听完——去渡口枢纽，回望四时
      goto: ferry.hub
  ferry.pavilion:
    title: 渡口 · 渡亭
    text: '渡亭很旧，四根柱子撑着个漏雨的顶。柱子上除了那张摆渡的价目，还刻满了过江人留的话。

      你一行行看过去：有还愿的，有咒骂的，有许了三年再来却再没来的。最旧的一行字，已经被虫蛀得缺了笔划，只认出"等"和"船"两个字。

      老渡工不知什么时候站在你身后："那是六十年前刻的。刻字的人，等了一辈子。"'
    onEnter:
      ferryClues.pavilion: 1
    choices:
    - text: 问老渡工，刻字的人是谁
      goto: ferry.boatman.ask
    - text: 去栈桥等过客
      goto: ferry.pier
  ferry.hub:
    title: 渡口 · 回望四时
    text: '你站在渡口中央，四时的过客都等在这里了。

      寻剑客摩挲着空剑鞘，行商望着江面发呆，画工之徒抱着画箱，书生还在背他的书。四个人，四桩未了之事，像四块从不同的年份漂来的浮木，在这渡口撞在一起。

      老渡工已经把船撑了过来，船头对着江心。你回头看看——四时的往事，哪些听全了，哪些还没。'
    choices:
    - text: 去和寻剑客再坐坐
      goto: ferry.spring.ask
    - text: 去和行商再坐坐
      goto: ferry.summer.ask
    - text: 去和画工之徒再坐坐
      goto: ferry.autumn.ask
    - text: 去和书生再坐坐
      goto: ferry.winter.ask
    - text: 问老渡工，这四个人到底渡不渡得过去
      goto: ferry.boatman.ask
    - text: 四时的过客都见过了——去拼一拼
      if: ferryClues.spring >= 1  or  ferryClues.summer >= 1  or  ferryClues.autumn >= 1  or  ferryClues.winter >= 1
      goto: ferry.merge
  ferry.boatman.ask:
    title: 渡口 · 老渡工
    text: '老渡工坐在船头，抽着旱烟。烟在雾里升起来，和他的头发一样白。船在江上轻轻晃，缆绳在水里拖出细长的波纹。

      "六十年了。我渡了多少人，记不清。可自己这一渡，一直没渡过去。"他吐了口烟，"这四个人，各渡各的岸。渡过去，还是渡不过去，都看他们自己。"'
    mode: dialogue
    dialogue:
      npc: 老渡工谈伯
      notes: 3
      onEnd: ferry.hub
      topics:
      - id: boatman
        name: 你自己的那一渡
        reply: 六十年前，这渡口有个人等我，等了三日。船来的时候，我没敢上。刻在渡亭柱子上的"等"字，就是她刻的。这一甲子，我摆别人的船，自己的船，一直没敢开。
        effect:
          ferryClues.boatman: 1
          ferryEvidence: 1
      - id: four
        name: 这四个人
        reply: 寻剑的，怯的是认剑；贩货的，怯的是认路；画画的，怯的是认命；读书的，怯的是认债。渡口不渡命，渡的是认不认。
        effect:
          ferryClues.four: 1
      - id: stone
        name: 四时碑背面那行字
        reply: 背面那行字，也是她刻的。"船家，明日再来。"她等了三日。第四日，我没去。那行字，我天天看，看了六十年。
        effect:
          ferryClues.stone: 1
  ferry.merge:
    title: 渡口 · 开船
    text: '老渡工解了缆绳，四个人陆续上船。船吃水了，往江心慢慢去。

      你站在栈桥头，把四时的往事在心里过了一遍：空剑鞘、压着的货、没画完的图、一摞旧书。四个人各怀着一桩未了之事，渡的是同一条江，过的却是各自的坎。

      船到江心，雾忽然薄了。你看见对岸的渡口，和这边的，一模一样。

      你心里，有了计较。'
    choices:
    - text: 四段关键都听全了——喊住那四个人：渡过去，把该认的认了
      if: ferryEvidence >= 4
      goto: ferry.end-truth
    - text: 你只问满了寻剑客——朝他喊：剑鞘空着，也能渡
      if: ferryClues.swordQ >= 2
      goto: ferry.end-sword
    - text: 你只问满了行商——朝他喊：货沉不了，路就在
      if: ferryClues.trailQ >= 2
      goto: ferry.end-trail
    - text: 你只问满了画工之徒——朝他喊：线画下去，水就顺着走
      if: ferryClues.riverQ >= 2
      goto: ferry.end-river
    - text: 你只问满了书生——朝他喊：书读过的，都不白读
      if: ferryClues.letterQ >= 2
      goto: ferry.end-letter
    - text: 你问过老渡工，也听全了四段——该渡的，还有摆渡的人自己
      if: ferryClues.boatman >= 1  and  ferryEvidence >= 6
      goto: ferry.end-cross
    - text: 你什么都没听全——雾又起了，船远了
      goto: ferry.end-fog
  ferry.end-truth:
    title: 结局 · 各渡各岸
    text: '船到江心，你朝船上喊：

      "程四——剑鞘空着，也能渡。你不认那点怯，怯就跟着你一辈子。"

      "卞六——货沉不了。你不敢进东市的城门，路才真断了。"

      "叶青——线画下去，水就顺着走。你师兄的数，在你手里。"

      "冯砚——书读过的，都不白读。债要还，考也要考。"

      四个人站在船头，回头望你。雾散了一点，他们各自都笑了。

      船靠了对岸。寻剑客把空剑鞘系回腰间，行商赶着骡子进了城，画工之徒把画箱往肩上一提，书生整了整青衫，大步走了。

      四个人的背影，各朝各的路。可这渡口，从此没有回头客了。'
    choices:
    - text: 再走一遭这渡口
      goto: '@restart'
  ferry.end-cross:
    title: 结局 · 摆渡人
    text: '船靠了对岸，四个人都下了船。可老渡工还站在船头，望着上游，一动不动。

      你走上栈桥，喊他："谈伯，你那一渡呢？"

      他回过头，眼里有水光："六十年了。船在，篙在，人——不知道还在不在。"

      上游的雾里，忽然亮起一点光。是盏旧灯，慢慢地往渡口来。

      老渡工的手抖起来。他解开缆绳，把船篙往水里一撑，船朝着上游去了。船头划开雾，像划开六十年。

      后来，这渡口换了新渡工。四时碑背面那行小字——"船家，明日再来"——被青苔盖住了，再没人去擦。

      可每年春水涨起来的时候，都有人看见上游漂来一盏旧灯，在渡口转三圈，又往上游去了。

      摆渡的人，到底摆渡了自己。'
    choices:
    - text: 再走一遭这渡口
      goto: '@restart'
  ferry.end-sword:
    title: 结局 · 空剑鞘
    text: '船开了。你只和寻剑客聊透了，朝他喊："剑鞘空着，也能渡。"

      他站在船头，回头笑了笑，把空剑鞘高高举起。鞘在日光里划了一道弧，像一柄无形的剑，劈开了江上的雾。

      船远了。你后来听说，他在对岸开了家武馆，教人使剑。学生问他，师父的剑呢？他拍拍腰间的空剑鞘："剑在我这儿，也在我心里。"

      那柄古堡里的剑，到底有没有人取走，没人知道。可有一样你确定：程四的怯，渡过去了。'
    choices:
    - text: 再走一遭这渡口
      goto: '@restart'
  ferry.end-trail:
    title: 结局 · 货与路
    text: '船开了。你只和行商聊透了，朝他喊："货沉不了，路就在。"

      他在船头朝你拱了拱手。骡子在船上打了个响鼻，像应声。

      船远了。你后来听说，卞六的绸缎在东市卖了个好价钱，他还了本钱，又回了荒漠，找到了老把头。商队重新起了，驼铃又响在沙丘后头。

      那枚铜符，他还揣在怀里，没卖。有人问他为什么不卖，他说："念想这东西，比三十金值钱。"'
    choices:
    - text: 再走一遭这渡口
      goto: '@restart'
  ferry.end-river:
    title: 结局 · 笔下有数
    text: '船开了。你只和画工之徒聊透了，朝他喊："线画下去，水就顺着走。"

      他在船头深深一揖。画箱在背上轻轻晃，像师兄拍了拍他的肩。

      船远了。你后来听说，那幅堤坝渗漏图送到了府城，河工账重查，八百两亏空追了回来。县志的河工卷重修，第八十九页上，画的是新堤——题着两个人的名字：陈砚秋，叶青。

      笔底下有数的，心里就有数。数，到底递到了。'
    choices:
    - text: 再走一遭这渡口
      goto: '@restart'
  ferry.end-letter:
    title: 结局 · 十年与三吊钱
    text: '船开了。你只和书生聊透了，朝他喊："书读过的，都不白读。"

      他在船头朝你鞠了一躬，青衫的下摆在江风里飘起来。

      船远了。你后来听说，科举真的停了。可冯砚没有回去——他在京城进了新式学堂，后来又做了教书先生。那三吊钱，他攒了五年，连本带利还上了。

      再后来，他母亲托人捎来一件新棉袄。他在信里写："旧的那件，还暖。"'
    choices:
    - text: 再走一遭这渡口
      goto: '@restart'
  ferry.end-fog:
    title: 结局 · 雾锁渡口
    text: '你什么都没听全。

      雾又起了，浓得把船吞了。你只听见船篙点水的声音，一下，又一下，越来越远。

      四时碑还在渡亭后头立着。四行字，被你用袖子擦亮了一半，又起了新的青苔。

      你离开渡口，沿着江走。走了很远，回头望，渡口已经看不见了。可那雾，一路跟着你，跟到天黑。

      有些坎，没渡过去的人，会把它背一辈子。这渡口你还会来吗？你不知道。

      你只知道，那条船，明早还会开。'
    choices:
    - text: 再走一遭这渡口
      goto: '@restart'
