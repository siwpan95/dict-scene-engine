# 由 scripts/migrate/json2yaml.py 从 content/whisper.js 转换
# （条件表达式已转 Python 语法；业务内容原样，未人工校对）
scenes:
  whisper.start:
    title: 深巷 · 夜
    text: '你住的老城区，有一条深巷。老辈人说，夜里的深巷，别一个人走——墙会说话，井会数人，门会问路。

      今夜，你为抄近路，还是拐进了这条巷子。

      巷口的路灯坏了，一闪，灭了。前面是一段一段的黑暗，深得看不见底。

      你听见了什么。很轻，像有人贴着你的后颈，在喊你的小名。'
    choices:
    - text: 往前走——路在脚下，别回头
      goto: whisper.hub
  whisper.hub:
    title: 深巷 · 巷心
    text: '你走到巷心。四面都是老墙，墙上爬着枯藤，风一吹，藤影像无数只手。

      左手边是一口老井，井圈上长满青苔。右手边是一扇半掩的木门，门里黑黢黢的。正前方，巷子分了两岔：一岔通着破庙，一岔直直地往更深处去。

      那些低语又响了。这一次，你听清了——它在问你要不要听。

      你的脑子还清楚。可巷子里的东西，就等着你不清楚。'
    choices:
    - text: 把耳朵贴到墙上，听它说
      do:
        sanity: -1
      goto: whisper.wall
    - text: 凑到井边，往下看
      do:
        sanity: -1
      goto: whisper.well
    - text: 去推那扇半掩的门
      do:
        sanity: -1
      goto: whisper.door
    - text: 去破庙里避一避，压压惊
      if: not flags.whisper.rested
      do:
        sanity: 1
        flags.whisper.rested: true
      goto: whisper.temple
    - text: 不听了——顺着巷子往外跑
      if: sanity >= 3
      goto: whisper.end-escape
    - text: 撑过这一夜——蹲在墙角，等天亮
      if: flags.whisper.wall  or  flags.whisper.well  or  flags.whisper.door
      goto: whisper.end-dawn
    - text: 你听不清了——什么也听不清了
      if: sanity <= 0
      goto: whisper.end-lost
  whisper.wall:
    title: 深巷 · 墙
    text: '你把手贴上墙。墙皮冰凉，像贴着一片冻了千年的水。

      低语从墙缝里渗出来，断断续续的。它说的，是你七岁那年走丢的那条狗，是你娘夜里给你盖被时叹的那口气，是你这辈子再没对人提起的一桩旧事。

      墙知道。墙什么都知道。

      你想把手收回来，可手像长在了墙上。'
    onEnter:
      flags.whisper.wall: true
    choices:
    - text: 用力把手撕下来——掌心脱了一层皮
      goto: whisper.hub
  whisper.well:
    title: 深巷 · 井
    text: '你凑到井边往下看。井水黑沉沉的，映着你的脸，又不止你的脸。

      水里的影子在数数：一个，两个，三个……数到你的时候，它停住了，问了一句："下面还缺一个，来不来？"

      井口的青苔滑了一下，你半个身子探了出去。'
    onEnter:
      flags.whisper.well: true
    choices:
    - text: 撑着井圈退回来——腿软得站不直
      goto: whisper.hub
  whisper.door:
    title: 深巷 · 门
    text: '你推开门。门里比巷子还黑，像一口竖着的棺材。

      一个声音从最深处问："进来的人，找谁？"你说不出名字。它又问："那你进来做什么？"

      你忽然想起，这扇门，你小时候好像进过——是去找一个人，那人后来……

      门在身后，轻轻合上了。'
    onEnter:
      flags.whisper.door: true
    choices:
    - text: 转身撞开门，逃回巷子里
      goto: whisper.hub
  whisper.temple:
    title: 深巷 · 破庙
    text: '破庙里供着一尊缺了半张脸的神像，香炉是空的，蒲团是潮的。

      你在门槛内坐下，背靠着门板。庙外的低语像是被什么挡住了，远了一层。

      心跳慢慢平下来。你数着自己的呼吸：一、二、三。数到一百，脑子又清明了。

      神像的剩脸在月光里，似笑非笑。'
    choices:
    - text: 起身，回巷心
      goto: whisper.hub
  whisper.end-escape:
    title: 结局 · 逃出
    text: '你不再听了，顺着巷子往外跑。

      低语在身后追，一句一句，喊你的小名，喊你的旧事，喊得又急又密。你捂着耳朵跑，鞋都跑掉了一只。

      巷口的灯，忽然亮了。你一头扑进光里，回头望——深巷黑沉沉地横在那里，像一条闭着的嘴。

      你活下来了。可从此你再没走过那条巷子。

      有些地方，逃出来的人，才听得见它夜里在笑。'
    choices:
    - text: 再走一遭这深巷
      goto: '@restart'
  whisper.end-dawn:
    title: 结局 · 天亮
    text: '你蹲在墙角，抱紧膝盖，数自己的呼吸，从一数到一千，再从一千数回一。

      低语响了一夜。它说累了，就换一句；你听木了，就再数一遍。

      天边泛白的时候，低语忽然停了。巷子里的黑暗一寸寸褪下去，露出斑驳的老墙、青苔的井、那扇半掩的门——都旧旧的，安安静静的。

      你站起来，腿麻得不会走路。晨风灌进巷子，凉飕飕的，可它是真的风。

      天亮了。有些夜，撑过去，就只是夜。'
    choices:
    - text: 再走一遭这深巷
      goto: '@restart'
  whisper.end-lost:
    title: 结局 · 沉沦
    text: '你的脑子，终于不清楚了。

      墙在说你的旧事，井在数你的人，门在问你的名字。你忽然分不清哪一句是它们说的，哪一句是你自己心里想的。

      你朝巷子更深处走。影子拖在身后，越拖越长，最后多出来一个——它跟了你一路，你一直没回头。

      后来，老城区的人说，深巷里多了一个夜游的人，逢人就问："进来的人，找谁？"

      没人答得上来。

      夜里的深巷，又多了一句低语。'
    choices:
    - text: 再走一遭这深巷
      goto: '@restart'
