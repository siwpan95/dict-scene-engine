# 由 scripts/migrate/json2yaml.py 从 content/promote.js 转换
# （条件表达式已转 Python 语法；业务内容原样，未人工校对）
scenes:
  promote.start:
    title: 候补 · 得图
    text: '你在衙门候补了七年，七年来，案卷抄了一屋子，俸禄领得刚够嚼用。

      这一日，一个同年的书办塞给你一张旧纸："老兄，这是张升官图。照着走，能上。"

      你展开看，纸上画着一架官梯，一级一级，从"候补"到"入流"到"京官"。每级旁边，用蝇头小字写着该走的路。

      有些字，是用红笔添的；添上去的，都不太正。'
    choices:
    - text: 把图折好，揣进怀里——七年了，总得搏一搏
      goto: promote.hub
  promote.hub:
    title: 衙门 · 候补房
    text: '候补房是一间偏厦，四面堆着旧案卷。你的位置靠窗，窗纸破了个洞，透进来的风，一年四季都是凉的。

      案上摊着那张升官图。图上的路，一条条通上去；可每条路上，都蹲着一件事。

      同僚们来来往往，各自奔各自的前程。今日，你该走哪一步？'
    choices:
    - text: 去帮王主簿抄卷，顺便送点家乡土产
      goto: promote.gift
    - text: 把土产原样提回，只送抄好的卷
      goto: promote.refuse
    - text: 闭门读书，把制艺文章再磨一遍
      goto: promote.study
    - text: 去同知大人的宴上，混个脸熟
      goto: promote.scheme
    - text: 有一桩断不清的案子，主动请缨
      goto: promote.case
    - text: 大考要到了——该去报名了
      goto: promote.exam
    - text: 图的尽头，就在眼前了——该做个了断
      if: promoteRight >= 1  or  promoteBend >= 1
      goto: promote.merge
  promote.gift:
    title: 衙门 · 送土产
    text: '王主簿收了土产，笑得眼睛眯成一条缝。他把你抄的卷子翻了翻，往你的考语上，多添了一笔："勤谨"。

      那一笔，比你自己写半年的卷子都管用。

      从王主簿那儿出来，你在廊下站了站。袖子里还剩下几个铜板，是你这个月的嚼用。'
    choices:
    - text: （这一笔，值了）
      do:
        promoteBend: 1
      goto: promote.hub
  promote.refuse:
    title: 衙门 · 拒礼
    text: '你把土产原样提回。王主簿的脸当场就撂了下来，考语上只写了四个字："办事尚可"。

      "尚可"两个字，在候补房里，跟"不用"差不多。

      你回到偏厦，把土产分给同僚吃了。有人笑你傻，你只说："自家的东西，自己吃，香。"'
    choices:
    - text: （香，可是路远了）
      do:
        promoteRight: 1
      goto: promote.hub
  promote.study:
    title: 衙门 · 读书
    text: '你把制艺文章磨了一遍又一遍，灯油熬干了三盏。

      同僚笑你："这年月，谁还凭文章升官？"你不答，只把"民为贵"三个字，写得比谁都端正。

      窗外有更鼓。你忽然想，读了这么多年书，书里说的和衙门里做的，怎么像两回事。'
    choices:
    - text: （书不会骗人，可书不给人升官）
      do:
        promoteRight: 1
      goto: promote.hub
  promote.scheme:
    title: 同知宴 · 混脸熟
    text: '同知大人的宴上，你抢着斟酒、递巾、讲两句凑趣的话。

      大人多看了你一眼，点点头。旁边有人低声道："这小子，有眼色。"

      宴散时，你在门口候着，替大人牵马。大人拍了拍你的肩："后生可畏。"

      你弯着腰，脸埋在马的影子里。'
    choices:
    - text: （腰弯下去，路就直了）
      do:
        promoteBend: 1
      goto: promote.hub
  promote.case:
    title: 衙门 · 断案
    text: '那桩断不清的案子：富户告贫汉偷鸡，贫汉喊冤，说鸡是自己家的。

      你查了三日，鸡毛都数了，最后判了富户一个"诬告"。

      富户连夜给同知递了话。你的判词被驳了，改成"各打二十大板"。

      你站在堂下，看两个人都挨了板子。那贫汉回头看你，眼里没有恨，只有认命。'
    choices:
    - text: （这案子，你判对了，也判"错"了）
      do:
        promoteRight: 1
      goto: promote.hub
  promote.exam:
    title: 衙门 · 大考
    text: '大考之日，考场外头挤满了候补的人。你看见有人往袖子里塞夹带，有人给考官递名帖。

      轮到你了。题发下来，是"论为官之本"。

      你提笔，墨在砚上停了很久。为官之本——书上写的一套，衙门里做的另一套。该写哪一套？'
    choices:
    - text: 写书上那一套——哪怕它升不了官
      do:
        promoteRight: 1
      goto: promote.hub
    - text: 写衙门里那一套——文章是敲门砖，门后头的事，进去再说
      do:
        promoteBend: 1
      goto: promote.hub
  promote.merge:
    title: 衙门 · 图的尽头
    text: '七年候补，加这一程的走法，都写在这张升官图上了。

      你把图摊在案上，看自己走过的那几个红圈、黑圈。窗外的风从破纸洞里钻进来，吹得图角一掀一掀。

      放榜的日子快到了。同僚们凑在廊下，说谁要升、谁要调、谁要再候一年。

      你摸着那张图，心里像明镜，又像糊了纸。'
    choices:
    - text: 照着红圈走到底——升官，就在这一榜
      if: promoteBend >= 2
      goto: promote.end-rise
    - text: 把黑圈一个个走穿——这官，不当也罢
      if: promoteRight >= 2
      goto: promote.end-fall
    - text: 把图折起来——候着，也是一种活法
      goto: promote.end-idle
  promote.end-rise:
    title: 结局 · 升官
    text: '你升了。

      榜文贴出来那天，同僚们围着道贺，脸上都是笑。你一一还礼，腰弯得恰到好处。

      新官印送到手里，沉甸甸的。你翻来覆去地看，忽然想起那桩断不清的案子，想起那个贫汉认命的眼神。

      夜里，你坐在新衙门的大案后头，把那张升官图拿出来，就着烛火，一个红圈一个红圈地看。

      图烧掉了。灰落在官靴上。

      你上去了。可上去的路上，丢了点东西——轻飘飘的，捡不回来了。'
    choices:
    - text: 再走一遭这候补的衙门
      goto: '@restart'
  promote.end-fall:
    title: 结局 · 罢官
    text: '你没升，反倒出了事。

      那桩"诬告"的案子，富户一直记着。大考一过，他把你的"尚可"考语抄了十份，贴得满城都是。

      上头查下来，说你"不通时务"。官帽摘了，你卷起铺盖出了衙门。

      出城那天，同僚没一个来送。只有那个贫汉，站在城门口，朝你作了个长揖。

      你笑了。腰杆挺得笔直，走过了七年来天天走的衙前街。

      官丢了。可夜里睡觉，不做亏心的梦。'
    choices:
    - text: 再走一遭这候补的衙门
      goto: '@restart'
  promote.end-idle:
    title: 结局 · 闲居
    text: '你没有升，也没有倒。

      榜上有名没名，你都不去看了。你把那张升官图折成一只纸船，放进护城河里。船在河里打了个转，慢慢漂远了。

      后来，你在城南开了间小书铺，卖笔墨，也替人写信。衙门的旧同僚来买纸，见你，都笑："你呀，可惜了。"

      你只是磨墨。墨磨匀了，字就正。

      有一年，那个贫汉的儿子来买纸，说要去考学。你多送了他一刀纸。

      候补七年，闲居半生。图漂走了，人还在。'
    choices:
    - text: 再走一遭这候补的衙门
      goto: '@restart'
