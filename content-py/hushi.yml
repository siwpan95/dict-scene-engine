scenes:
  hushi.start:
    title: 一九一一年六月十八日 · 孛可诺松林（容忍 {toleration} · 独立 {independence}）
    text: 'Pocono 山顶。地高，气爽，天寒，屋里竟有人生起了火。

      中国留美东省耶教会与美国东省耶教学生会开联合大会，中国学生到者约三十余人。

      连日听名人演说，看旧日友人受感化，其变化气质之功，真令人可惊。

      下午绍唐为你陈说耶教大义，约三时之久，你大为所动。

      傍晚 Father Hutchington 说教，讲《马太福音》第二十章——葡萄园的比喻，极明白动人。

      入夜 Mr. Mercer 演说其一身所历，甚动人，你为堕泪。听众亦皆堕泪。

      会终，有七人起立，自愿为耶稣信徒。绍唐在看你。

      你却想起上月由绮色佳转来的那封信：乐亭死了。

      自那以后日益无聊，又兼课毕，终日无事。每一静坐，辄念人生如是，亦复何乐。

      你出门来这山上，大半为此——盖欲借彼中宗教之力，稍杀吾悲怀耳。

      你要借的是宗教，要杀的是悲。这两件事，本不相干。'
    choices:
    - text: 起立。
      do:
        toleration: 1
      goto: hushi.p1.cards
    - text: 不起立。
      do:
        independence: 1
      goto: hushi.p1.cards
    - text: 先问绍唐一句：信了，就不痛了吗？
      goto: hushi.start.ask
  hushi.start.ask:
    title: 孛可诺松林 · 会后
    text: '你把绍唐拉到屋外。山风很凉，屋里透出的灯光在雪地上照出一小片黄。

      「绍唐，」你说，「我若今日受洗——那是为了上帝，还是为了我自己？」

      绍唐愣了一下：「有分别么？」

      「有。若是为了上帝，我该先信。若是为了我自己——」

      你没说下去。

      你想起那封写给希吕的信，写到这句时手一直在抖：此次出门，大半为此，盖欲借彼中宗教之力，稍杀吾悲怀耳。

      借来的东西，是要还的；被杀的悲，明日还会自己活过来。

      绍唐没有催你。他只把门推开一条缝，屋里的热气涌出来，像一句没说完的劝。'
    choices:
    - text: 回屋去。你已经知道该怎么做了。
      goto: hushi.start
  hushi.p1.cards:
    title: 一九一一年秋 · 绮色佳寓所（容忍 {toleration} · 独立 {independence}）
    text: '开学已一月有余。桌上摊着没读完的书，书页上压着一张纸条——前日与金涛君写的四个字：相戒不复打牌。

      你做到了九天。

      电话响了。刘千里在那一头说：三缺一。

      窗外天色将暗，绮色佳的秋天来得早，风把窗框吹得咯咯响。

      你想着那本没读完的书，想着明日要交的课业，想着金涛说那句话时的神情——他是认真的，你也是。

      可你也知道：一个人坐在屋里，会想到乐亭。

      牌桌上有四个人等着。书桌上有一本书等着。

      （五十年后你还会摸到牌。那时你七十二岁，在南港的寓所里，用它压住一句话说不出口的晚上。）'
    choices:
    - text: 去。
      do:
        cardsPlayed: 1
        toleration: 1
      goto: hushi.p1.society
    - text: 不去。把那张纸条压回书里。
      do:
        independence: 1
      goto: hushi.p1.society
    - text: 都不做——翻一翻来美国后记的这几册札记。
      goto: hushi.diary
  hushi.diary:
    title: 重读 · 旧札
    text: '你把这几册札记摊在桌上。

      桐油灯的光很黄，纸边卷了角，有几页是在火车上写的，字迹歪斜。

      你一篇一篇翻过去，像在读一个不认识的人。

      ——他每一个选择，都比你以为的更轻，也比你以为的更难改。

      （可重读已走过的篇目。重读不改任何事，只是再看一遍。）'
    mode: diary
    diary:
      onExit: hushi.p1.society
  hushi.p1.society:
    title: 一九一一年九月二日 · 赔款学生会（容忍 {toleration} · 独立 {independence}）
    text: '赔款学生会开会，你被举为中文书记，又兼会报事。

      散会后你站在走廊上，手里捏着那张当选的条子。窗外有人在打网球，喊声隔着草地传过来。

      会报是每月一期的：稿子要人约、要人改、要人跑印厂。中文书记更麻烦——章程、信札、通告，件件落在你头上。

      你算了一下：一天若匀出两个钟头给会里，一年就是七百三十个钟头。

      那七百三十个钟头，本该是康德，是杜威，是实验主义。

      可你也知道，这学生会是赔款生的脸面。你不做，就得有个更不合适的人做。

      方才开会时你翻了一页报纸：第三次赔款学生，今日抵旧金山。

      那些孩子下船的时候，会有人替他们说话么？'
    choices:
    - text: 接下。总得有人做。
      do:
        toleration: 1
      goto: hushi.p2.question
    - text: 辞了。你的时间不是拿来填表格的。
      do:
        independence: 1
      goto: hushi.p2.question
  hushi.p2.question:
    title: 一九一四年十一月三日 · 韦莲司之问（容忍 {toleration} · 独立 {independence}）
    text: '韦莲司女士忽然问你：

      「若吾人所持见解与家人父母所持见解扞格不入，则吾人当容忍迁就以求相安乎？抑将各行其是，虽至于决裂破坏而弗恤乎？」

      你后来在札记里写：此问题乃人生第一重要问题，非一言所能尽。你细思之，得二种解决。

      ——东方人之见解：昔毛义有母在，受征辟，捧檄而喜。其喜也，为母故也。母卒，即弃官去。义本不欲仕，乃为母屈耳。

      父母老矣，一旦遽失其所信仰，如失其所依归，其痛苦何可胜算？其容忍也，出于体恤爱我者之心理。

      你名之曰：为人的容忍。

      ——西方近世之说：凡百责任，以对一己之责任为最先。对一己不可不诚。吾所谓是，则是之，笃信而力行之，不可为人屈。

      真理一而已，不容调护迁就。若人人为他人之故而自遏其思想言行之独立自由，则人类万无进化之日矣。

      （弥尔之《群己权界论》倡此说最力，易卜生之名剧《玩物之家》亦写此意也。）

      窗外是绮色佳的深秋。她等着你的回答。'
    choices:
    - text: 「吾于家庭之事，则从东方人。」
      do:
        toleration: 2
      goto: hushi.p2.photo
    - text: 「于社会国家政治之见解，则从西方人。」
      do:
        independence: 2
      goto: hushi.p2.photo
    - text: 「吾于家庭之事，则从东方人；于社会国家政治之见解，则从西方人。」
      do:
        toleration: 1
        independence: 1
        flags.hushi.questionWord: both
      goto: hushi.p2.photo
  hushi.p2.photo:
    title: 一九一四年六月六日 · 得家中照片
    text: '去年得家中照片，吾母与冬秀皆在焉。

      你把那张照片从书里抽出来，边角已经磨毛了。

      邮人授我书，厚与寻常殊。开函喜欲舞，全家在画图。

      中图坐吾母，貌戚意不舒；悠悠六年别，未老已微癯。

      ——六年了。母亲坐在中间，脸上没有笑意，人比六年前瘦。

      图左立冬秀，朴素真吾妇。轩车来何迟，劳君相待久。

      十载远行役，遂令此意负。归来会有期，与君老畦亩。

      筑室杨林桥，背山开户牖。辟园可十丈，种菜亦种韭。我当授君读，君为我具酒。

      ——你写这些句子的时候是很认真的。你真的想过杨林桥那座房子，想过那十丈园子，想过种菜也种韭。

      可你现在在绮色佳，离杨林桥一万一千海里。'
    choices:
    - text: 把照片收进书里，回一封信。
      do:
        items.photo: 1
        toleration: 1
      goto: hushi.p2.willow
    - text: 不回。你不知道该写什么。
      do:
        independence: 1
      goto: hushi.p2.willow
  hushi.p2.willow:
    title: 一九一四年十一月十三日 · 秋柳
    text: '韦莲司女士以她在纽约居室窗上所见的景色，摄影数纸见赠。择景深得画意，不类凡手。

      此间殊不多见垂柳，平日所见大都粗枝肥叶，无飘洒摇曳之致。一日与女士过大学街，见垂柳一株，迎风而舞，你为徘徊其下者久之。

      你告诉她：吾国古代有「折柳赠别」之俗，故诗人咏柳恒有别意。

      她就要去纽约了。

      你想起戊申年在上海，秋日适野，见万木皆有衰意，独垂柳迎风而舞，意态自如——

      已见萧飕万木摧，尚余垂柳拂人来。凭君漫说柔条弱，也向西风舞一回。

      《说苑》记常摐将死，老子往问焉。常摐张其口而示老子曰：「吾舌存乎？」曰：「然。」「吾齿存乎？」曰：「亡。」

      常摐曰：「子知之乎？」老子曰：「夫舌之存也，岂非以其柔耶？齿之亡也，岂非以其刚耶？」

      她也说起日本犯中国中立的事：中国政府不之抗拒，自外人观之似失国体；然若以兵力拒之，所损当更大千百倍。

      你把「秋柳」那首诗念给她听。她说，此中大有真理。

      （那几幅图里，有一幅是雪中之柳。你后来把它删了。）'
    choices:
    - text: 以垂柳图为别。
      do:
        items.willow: 1
      goto: hushi.p2.letter
    - text: 以垂柳图为别——连同那幅雪中之柳。
      do:
        items.willow: 2
        toleration: 1
      goto: hushi.p2.letter
    - text: 不赠。赠了，就真是别了。
      do:
        independence: 1
      goto: hushi.p2.letter
  hushi.p2.letter:
    title: 一九一五年四月 · 得冬秀书
    text: '得冬秀一书，辞旨通畅。你不知道系渠自作，抑系他人所拟稿。

      书中言放足事已行之数年——此大可喜也。

      渠母病甚，读之恻然。

      岳氏你于甲辰春见过。她为择婿故，来你外祖家会你母及你，同居数日始别，今十余年矣。

      岳氏今年五十有八。老病且死，而「向平」之愿未了——则余亦不得辞其咎耳。

      你在屋里走了很久。

      五月十九日，你写第九号家书。你在信里说：儿对于儿之婚事并无一毫怨望之意。盖儿深知吾母为儿婚姻一事，实已竭尽心力；儿若犹存怨望之心，则真成不识事势、不明人情、不分好歹之妄人矣。

      你还写：伉俪而兼师友，固属人生一大幸事。然夫妇之间，真能学问平等者，即在此邦亦不多得，况在绝无女子教育之吾国乎？若儿悬知识平等四字以为求偶之准则，则儿终身鳏居无疑矣。

      ——知识平等。你给自己找了四个字，把这件事说圆了。

      可你知道那四个字的意思：你不是不怨，你是算过账了。'
    choices:
    - text: 就这样回信。四个字够了。
      do:
        toleration: 1
      goto: hushi.p2.leave
    - text: 划掉。重写。
      do:
        independence: 1
      goto: hushi.p2.leave
    - text: 另写一封——写给冬秀本人，不写给母亲。
      if: items.photo >= 1
      do:
        items.photo: 1
        toleration: 1
      goto: hushi.p2.leave
  hushi.p2.leave:
    title: 一九一五年九月廿一日 · 别矣绮色佳
    text: '九月二十日，遂去绮色佳。

      吾尝谓绮色佳为「第二故乡」，今当别离，乃知绮之于我，虽第一故乡又何以过之？

      吾去家十一年余，今心中之故乡，但有模糊之溪山，依稀之人面而已。老母，诸姊，一师，一友，此外别无所恋。

      而绮之溪壑师友，历历在心目中。

      此五年之岁月，在吾生为最有关系之时代。其间所交朋友、所受待遇、所结人士、所得感遇、所得阅历、所求学问，皆吾所自为——与自外来之梓桑观念不可同日而语。

      其尤可念者，则绮之人士初不以外人待余。余自视几如绮之一分子矣。

      今当去此，能无恋恋？昔人桑下三宿尚且有情，况五年之久乎？

      廿一日晨抵纽约，居佛纳儿得馆。所居室在五层楼上，下临广衢，车声轰轰，昼夜不绝。

      视旧居之「夜半飞泉作雨声」，真如隔世矣。'
    choices:
    - text: （她把柳带去了纽约。你们后来还通信。）
      if: items.willow >= 1
      do:
        toleration: 1
      goto: hushi.p3.haven
    - text: （那张「相戒不复打牌」的纸条，你还夹在书里。）
      if: cardsPlayed >= 1
      do:
        independence: 1
      goto: hushi.p3.haven
    - text: 入哥伦比亚。
      do:
        independence: 1
      goto: hushi.p3.haven
    - text: 先在纽约住下，把书写完再说。〔虚构分支〕
      do:
        toleration: 1
      goto: hushi.p3.haven
  hushi.p3.haven:
    title: 一九一六年七月十六日 · 九十二号（容忍 {toleration} · 独立 {independence}）
    text: '旅行归来，你迁入新居。

      新居在 92 Haven Ave。

      ——本韦女士旧寓。她夏间归绮色佳依其家人，故你得以赁其寓，为消夏计。

      其地去市已远，去大学亦近，僻静殊甚。友朋知者甚寡，即知亦以远故不常来，故你颇得暇可以读书。

      同居者为云南卢锡荣君。

      居室所处地甚高，可望见赫贞河，风景绝可爱。

      有人问你：日对如许好风景，何以不作诗？

      你说：太忙，一也；景致太好，非劣笔所敢下手，二也；年来颇不喜作全然写景的诗，正以其但事描写，三也。

      ——你没有说第四样。

      第四样是：这是她的房子，她的窗，她望出去的那条河。你住进来，像住进一句没说完的话里。

      （六年三月你在此页补记一句：末一段话，今已不然。）'
    choices:
    - text: 住下。
      do:
        flags.hushi.haven: true
        independence: 1
      goto: hushi.p3.poem
    - text: 另寻一处。
      do:
        toleration: 1
      goto: hushi.p3.poem
  hushi.p3.poem:
    title: 一九一六年七月三十日 · 一首白话诗引起的风波
    text: '前作答觐庄之白话诗，竟闯下了一场大祸，开下了一场战争。

      觐庄来信：读大作如儿时听「莲花落」，真所谓革尽古今中外诗人之命者！足下诚豪健哉！……文章体裁不同，小说词曲固可用白话，诗文则不可。……其所谓「新潮流」「新潮流」者，乃人间之最不祥物耳，有何革新之可言！

      叔永来信亦大不以为然：足下此次试验之结果，乃完全失败是也。……如凡白话皆可为诗，则吾国之京调高腔何一非诗？……以足下高才有为，何为舍大道不由，而必旁逸斜出，植美卉于荆棘之中哉？

      你答觐庄：老夫不怕不祥，单怕一种大不祥。大不祥者何？以新潮流为人间最不祥之物，乃真人间之大不祥已。

      你答叔永，写了三千余言，一条一条数自己那首诗的长处，数罢自嘲：

      「戏台里喝彩」，乃是人生最可怜的事，然亦未尝无大用。盖人生作文作事，未必即有人赏识。其无人赏识之时，所堪自慰者，全靠作者胸中自信可以对得起自己，全靠此戏台里之喝彩耳。

      末了你写：吾志决矣。吾自此以后，不更作文言诗词。吾之《去国集》，乃是吾绝笔的文言韵文也。'
    choices:
    - text: 「一次『完全失败』，何妨再来？」
      do:
        independence: 2
      goto: hushi.p3.eight
    - text: 先答觐庄，叔永那封慢慢回。
      do:
        toleration: 1
      goto: hushi.p3.eight
    - text: 把《去国集》收起来——以后不作文言诗词。
      do:
        independence: 1
      goto: hushi.p3.eight
  hushi.p3.eight:
    title: 一九一六年八月廿一日 · 八事
    text: '我主张用白话作诗，友朋中很多反对的。

      其实人各有志，不必强同。我亦不必因有人反对遂不主张白话。他人亦不必都用白话作诗。

      白话作诗不过是我所主张「新文学」的一部分。前日写信与朱经农说：新文学之要点，约有八事——

      （一）不用典。（二）不用陈套语。（三）不讲对仗。（四）不避俗字俗语。（五）须讲求文法。

      ——以上为形式的方面。

      （六）不作无病之呻吟。（七）不摹仿古人。（八）须言之有物。

      ——以上为精神（内容）的方面。

      能有这八事的五六，便与「死文学」不同，正不必全用白话。

      白话乃是我一人所要办的实地试验。倘有愿从我的，无不欢迎，却不必强拉人到我的实验室中来——

      他人也不必定要捣毁我的实验室。'
    choices:
    - text: 把八事抄寄《新青年》。
      do:
        independence: 2
      goto: hushi.p3.essay
    - text: 先只给几个朋友看。
      do:
        toleration: 1
      goto: hushi.p3.essay
    - text: 把「不避俗字俗语」一条单独提出来，再作一篇文章。
      do:
        independence: 1
        flags.hushi.eightFocus: true
      goto: hushi.p3.essay
  hushi.p3.essay:
    title: 一九一七年二月 · 近作文字
    text: '近作数文，记其目如下：

      （一）《文学改良刍议》。（寄《新青年》）

      （二）《吾我篇》《尔汝篇》。（登《季报》）

      （三）Review of Prof. B. K. Sarkar''s Chinese Religion through Hindu Eyes（登 The Hindusthanee Student, Nov. 1916）

      （四）A Documentary History of the Recent Monarchical Movement in China（登 The Journal of Race Development）

      ——你在这页底下停了一会儿。

      你此刻还不知道，一年之内这篇文章会变成一场运动的招牌；你也还不知道，往后五十年，你会一遍一遍地为它作解释、作辩护、作修正，直到没有人再需要你解释。

      此刻它只是《新青年》上一篇四千字的文章，和后面那三行英文书目排在一起，字号一样大。

      （底本此则作「私议」，全库检索「刍议」零命中，当为所据底本讹字；正文用通行名。）'
    choices:
    - text: 寄出去。
      do:
        independence: 2
      goto: hushi.p3.diaries
    - text: 再改一稿。
      do:
        toleration: 1
      goto: hushi.p3.diaries
    - text: 在文末补一段白话诗作例。
      if: flags.hushi.eightFocus
      do:
        independence: 1
      goto: hushi.p3.diaries
  hushi.p3.diaries:
    title: 一九一七年五月四日 · 读致韦女士旧函
    text: '昨在韦女士处，见吾两三年来寄彼之书一大束，借回重检读之。

      乃如读小说书，竟不肯放手。

      此中大率皆一九一五与一九一六两年之书为多，而尤以一九一五年之书为最要。

      吾此两年中之思想感情之变迁多具于此百余书中——他处决不能得此真我之真相也。

      你一封一封读下去。

      有些句子你现在写不出来了。有些句子你希望自己没写过。

      你读到很晚，第二天起来眼睛是涩的。'
    choices:
    - text: 把那一束借回来，从头再读。（此后可随时重读旧札）
      do:
        items.letters: 1
      goto: hushi.p3.return
    - text: 读完了，还回去。
      do:
        independence: 1
      goto: hushi.p3.return
    - text: （这间屋子，你到底是住进来了。）
      if: flags.hushi.haven
      do:
        toleration: 1
      goto: hushi.p3.return
  hushi.p3.return:
    title: 一九一七年六月 · 归国记（容忍 {toleration} · 独立 {independence}）
    text: '民国六年六月九日离纽约。十日晨到绮色佳，寓韦女士之家。连日往见此间师友，奔走极忙。

      在绮五日，殊难别去。韦夫人与韦女士见待如家人骨肉，尤难为别。

      吾尝谓朋友所在即是吾乡。吾生朋友之多无如此邦矣。今去此吾所自造之乡而归吾父母之邦，此中感情是苦是乐，正难自决耳。

      十四日下午离绮色佳。夜到水牛城。半夜后到尼格拉瀑，将过加拿大界。

      关吏叫醒你，说证书不够，不得过界。你说：纽约领事证书何以无效？

      关吏说：吾但知认加拿大政府命令，不能认中国领事证书也。

      时夜已深，车马都绝。幸有警察为你呼一汽车，载至尼格拉瀑市，投一旅馆，睡了三点钟。

      ——你躺在陌生旅馆的床上想：一个中国人拿着中国领事的证书，在别人的国界上过不去。

      七月三夜，海上第一次见月。你作《百字令》寄叔永、杏佛、经农、亦农、衡哲：孤舟带月，海天冲浪西去。……凭阑自语，吾乡真在何处？

      陆放翁词云：重到故乡交旧少，凄凉，却恐他乡胜故乡。——此即吾「吾乡真在何处」之意。

      七月五日，船进横滨港，始知张勋拥宣统复辟之消息。'
    choices:
    - text: 归国。船到上海。
      do:
        independence: 1
      goto: hushi.p4.telegram
    - text: 留下。吾乡真在何处——你还没有答案。〔虚构分支〕
      do:
        toleration: 1
      goto: hushi.end-wherehome
    - text: （在走之前，再读一遍那百余封旧函。）
      if: items.letters >= 1
      goto: hushi.diary2
  hushi.diary2:
    title: 重读 · 旧札
    text: '你把这几册札记和那一束旧函一起摊在桌上。

      从一九一一年到此刻，六年。你在纸上跟自己争了六年。

      有些争论你已经赢了，有些你输得很难看，还有一些你当时以为赢了，现在看才发现自己根本没听懂对方在问什么。

      （可重读已走过的篇目。重读不改任何事，只是再看一遍。）'
    mode: diary
    diary:
      onExit: hushi.p3.return
  hushi.p4.telegram:
    title: 一九三八年七月二十五日 · 巴黎转来的电报
    text: '今日下午得孔庸之电，是巴黎转来的。他说：

      儒堂因母老多病，极思归国，政府因拟加以调整。介公及弟甚愿借重长才，大使一职，拟由吾兄见畀。务乞体念国难严重，俯允电复为幸。

      你与林斐成兄谈，他力劝你莫辞。

      到 Universities China Committee，见着 Sir Malcolm、Hubbard、Morkill、Mr. Swire 诸人。

      ——二十一年了。

      一九一七年你从这条路上回去，一九三八年你在这条路上接到这封电报。中间二十一年，你一直是一个人：

      你骂过军阀，骂过玄学，办过《努力》，办过《新月》，跟人打过「问题与主义」的仗，也跟人打过「人权」的仗。你谁的人都不是。

      现在有人要你做一个官。

      你拟了好几封辞电。你拟一封，看一遍，撕了。再拟一封，看一遍，又撕了。'
    choices:
    - text: （再拟一封辞电。）
      do:
        independence: 1
        flags.hushi.declined: true
      goto: hushi.p4.ghost
    - text: 拟电允了。
      do:
        toleration: 2
        flags.hushi.accepted: true
      goto: hushi.p4.ghost
    - text: 拟不出来。先搁着。
      do:
        independence: 1
      goto: hushi.p4.ghost
  hushi.p4.ghost:
    title: 一九三八年八月二十日 · 似有鬼
    text: '译出端升电，云：

      尊事未公开，似有鬼。

      ——你复电云：greatly amused。乐坏了。

      可你笑完就不笑了。

      「似有鬼」三个字说的是：政府那边还没把你的任命公开。中间像是有人在拦，或者有人在等，或者有人在替你安排一个你并不想要的位置。

      你做了二十一年独立的人。现在你要等别人替你公布一件事——关于你自己的事。

      你把那三个字又看了一遍。'
    choices:
    - text: 当作笑话。greatly amused。
      do:
        toleration: 1
      goto: hushi.p4.sacrifice
    - text: 去电问个明白。
      do:
        independence: 1
      goto: hushi.p4.sacrifice
    - text: 不问。该来的会来。
      do:
        toleration: 1
      goto: hushi.p4.sacrifice
  hushi.p4.sacrifice:
    title: 一九三八年九月十三日 · 二十一年
    text: '今天得外部电，说政府今天发表我驻美大使。今天下午王亮畴有电来贺。

      你坐在那里，很久没有动。

      然后你写下这一句：

      二十一年的独立自由的生活，今日起，为国家牺牲了。

      ——你没有写「可惜」，没有写「不得已」，也没有写「义不容辞」。

      你只写了「牺牲了」三个字，像记一笔账。

      （同年九月十七日赴任。此后四年，你在美国各处演说，讲中国的抗战，讲民主与集权，讲一个还没打完的国。）

      （你再也没有回到那二十一年里去。）'
    choices:
    - text: 赴任。
      do:
        flags.hushi.tookPost: true
        toleration: 2
      goto: hushi.p5.deserter
    - text: 再辞一次——哪怕拟数电，均不能满意。〔虚构分支〕
      do:
        independence: 2
      goto: hushi.p5.deserter
    - text: （七月里你拟电允了。现在只是等它发生。）
      if: flags.hushi.accepted
      do:
        toleration: 1
      goto: hushi.p5.deserter
    - text: （七月里那几封辞电，你都留着，没有撕。）
      if: flags.hushi.declined
      do:
        independence: 1
      goto: hushi.p5.deserter
  hushi.p5.deserter:
    title: 一九四九年一月一日 · 南京
    text: '南京作「逃兵」，作难民，已十七日了！

      蒋先生有主张和平的文告。

      ——你只写了这两句。

      十七天前你从北平飞出来。走的时候只带了一箱书稿，和一部没校完的《水经注》。

      你六岁读《水浒传》，十九岁出国，二十六岁回国，二十七岁名满天下。

      你今年五十八岁。

      你写下「逃兵」两个字的时候，没有解释。'
    choices:
    - text: （你就是逃兵。）
      do:
        toleration: 1
      goto: hushi.p5.mansion
    - text: 不认。你只是不肯陪葬。
      do:
        independence: 1
      goto: hushi.p5.mansion
    - text: 把这两句留着，不删。
      do:
        toleration: 1
      goto: hushi.p5.mansion
  hushi.p5.mansion:
    title: 一九四九年一月八日 · 总统官邸
    text: '7:30 总统官邸晚餐。

      你为他述 General Wainwright 守 Bataan 力竭投降、胜利后释放回国、美国人热烈欢迎他、国会特授与「荣誉勋章」的事。

      ——你为什么要讲这个故事？

      一个力竭而降的将军，回国之后没有被审判，没有被唾弃，而是被授勋。

      你讲完，看他有没有动意。

      蒋公今夜仍劝你去美国。他说：

      我不要你做大使，也不要你负什么使命，例如争取美援，不要你去做。我止要你出去看看。

      ——我止要你出去看看。

      你没有当场答。

      （后来你在这一页的边上补了一行小字：不意一月八日夜是最后一次见蒋公！）'
    choices:
    - text: 答应去。
      do:
        flags.hushi.willGo: true
        toleration: 1
      goto: hushi.p5.pier
    - text: 不答。
      do:
        independence: 1
      goto: hushi.p5.pier
    - text: 答：我去，但不做官。
      do:
        flags.hushi.willGo: true
        independence: 1
      goto: hushi.p5.pier
  hushi.p5.pier:
    title: 一九四九年一月二十一日 · 送冬秀上船
    text: '送冬秀上海黔船，与傅孟真夫人同去台湾。

      码头上人很多。她上船之前没有说什么，你也没有。

      三十四年前你写过：图左立冬秀，朴素真吾妇。轩车来何迟，劳君相待久。

      ——轩车来何迟。你让她等了很久，现在船要开了。

      下午去看邱锦淇医士，请他为你诊察心脏。血压为 115/75。他为你做了一个 E.K.G.，邱君甚细心，谈颇久。

      回寓已过六点，即得罗静轩电话，说蒋总统四点离开南京，直飞杭州，转奉化了。

      你本定今夜夜车去南京。你仍决定去。

      ——你今年五十八岁，血压 115/75，心脏要人看。你本该上那条船。'
    choices:
    - text: 送她上船。你留下。
      do:
        toleration: 1
      goto: hushi.p5.milk
    - text: 同她上船去。〔虚构分支〕
      do:
        flags.hushi.sawWifeOff: true
        toleration: 1
      goto: hushi.p5.milk
    - text: （你本定今夜夜车去南京——你仍决定去。）
      if: flags.hushi.willGo
      do:
        independence: 1
      goto: hushi.p5.milk
  hushi.p5.milk:
    title: 一九五〇年七月十一日 · 一张破纸
    text: '北京大学农学院罗道庄农牧场牛奶款收据：

      今收到胡校长先生自 10 月 1 至 31 日止，牛奶壹磅 31 瓶，合 ￥440 整元。经手人 35 年 10 月 31 日。

      ——三十五年（一九四六）十月，你做北大校长。一个月，三十一瓶牛奶，四百四十元。

      今天我们偶然发现这张破纸，冬秀想不起这张破纸如何飞来海外，大概是包小物来的。

      ——大概是包小物来的。

      一张收据说：你曾经是一个校长，有一个每月送三十一瓶牛奶的农场，有一个要用牛奶的人。

      现在它只是一张包过小物、不知道怎么就漂过海来的纸。'
    choices:
    - text: 夹进书里。
      do:
        items.milk_receipt: 1
        toleration: 1
      goto: hushi.p5.remonstrate
    - text: 扔了。
      do:
        independence: 1
      goto: hushi.p5.remonstrate
    - text: （四百四十元。你算得出那是多少袋面粉。）
      do:
        toleration: 1
      goto: hushi.p5.remonstrate
  hushi.p5.remonstrate:
    title: 一九五三年一月十六日 · 诤臣
    text: '蒋公约我晚饭，七点见他，八点开饭。谈了共两点钟。我说一点逆耳的话，他居然容受了。

      我说，台湾今日实无言论自由。第一，无一人敢批评彭孟缉。第二，无一语批评蒋经国。第三，无一语批评「蒋总统」。所谓无言论自由，是「尽在不言中」也。

      我说，宪法只许「总统」有减刑与特赦之权，绝无加刑之权。而「总统」屡次加刑，是违宪甚明。然整个政府无一人敢向「总统」如此说！

      「总统」必须有诤臣一百人，最好有一千人。开放言论自由，即是自己树立诤臣千百人也。

      最奇怪的，是他问我，召开国民大会有什么事可做。他说：这一届国大可以两次选「总统」吗？

      他说：请你早点回来，我是最怕开会的！

      这最后一段话颇使我惊异。

      ——难道他们真估计可以不要宪法了吗？'
    choices:
    - text: 说。逆耳的话，说。
      do:
        independence: 2
        flags.hushi.remonstrated: true
      goto: hushi.p5.cards
    - text: 不说。他请你吃晚饭。
      do:
        toleration: 2
      goto: hushi.p5.cards
    - text: 说一半——只说宪法，不点人名。
      do:
        independence: 1
        flags.hushi.remonstrated: true
      goto: hushi.p5.cards
    - text: （你身上还带着那张牛奶收据——一个校长，三十一瓶牛奶。）
      if: items.milk_receipt >= 1
      do:
        independence: 1
      goto: hushi.p5.cards
  hushi.p5.cards:
    title: 一九六〇年十一月二十四日 · 南港（容忍 {toleration} · 独立 {independence}）
    text: '昨夜吃晚饭的时候，就知道雷震案「复判」的结果了。

      昨晚各报访员问我，我只说：大失望，大失望！

      今天看了判决书的日子——十一月十七日——我忍不住要叹气了。

      昨夜，胡适博士难得空闲，他在南港寓所的饭桌上，用三十二只天九牌「过五关」打发着时间。

      记者叩门往访，正是胡博士另一次「过五关」的开始。他微笑着要记者坐在旁边观看。

      他放下抓在右手的三只天九牌，很沉重地说：我是吃晚饭的时候，听到关于雷案复判的结果，饭后心情很不好，什么事都不愿做，所以玩「过五关」来解闷。

      他问记者懂不懂「过五关」，并解说各种规矩。他说：用地牌做「配」，最容易过关。

      于是他用地牌做「配」，当场表演。第一次没有成功。他叹了口气说：

      这真是像雷震一样的倒霉。

      ——五十年了。

      一九一一年那个秋天的晚上，刘千里打电话来：三缺一。你桌上压着一张纸条，是你自己写的四个字：相戒不复打牌。

      （这是剪报。晚年的他不再自己写，只把别人的报道剪下来，贴进日记。）'
    choices:
    - text: 再摆一次。用地牌做「配」。
      if: toleration >= 3  and  independence >= 3
      goto: hushi.end-cards
    - text: （一九一四年那个下午你说过：家庭从东方，政治从西方。你做了一辈子。）
      if: flags.hushi.questionWord == "both"
      goto: hushi.end-cards
    - text: 你想说的其实只有六个字：大失望，大失望。
      if: flags.hushi.remonstrated
      goto: hushi.end-remonstrator
    - text: 二十一年前那句：为国家牺牲了。
      if: flags.hushi.tookPost
      goto: hushi.end-sacrifice
    - text: 那句：我总想辞卸大使事，但拟数电，均不能满意。
      if: not flags.hushi.tookPost
      goto: hushi.end-decline
    - text: 「逃兵」。你写下这两个字的时候，没有解释。
      if: flags.hushi.sawWifeOff
      goto: hushi.end-deserter
    - text: 你留下了。你一直都在。
      goto: hushi.end-stay
  hushi.end-wherehome:
    title: 结局 · 吾乡真在何处
    text: '船上最后一夜。你扶着阑干，海风很咸。

      同舱的美国同学都睡了。你想起绮色佳的雪，想起赫贞河上的落日，想起 Haven Ave 那间屋子——

      你搬走那天，窗台上还留着半瓶墨水，没有盖盖子，冻住了。

      吾尝谓朋友所在即是吾乡。吾生朋友之多，无如此邦矣。

      今去此吾所自造之乡，而归吾父母之邦。

      此中感情，是苦是乐，正难自决耳。

      ……

      你没有上那条船。你留下了。

      很多年后有人问你：你到底算是哪里人？你说不上来。

      陆放翁词云：重到故乡交旧少，凄凉，却恐他乡胜故乡。

      ——此即吾「吾乡真在何处」之意。

      （这一问，你一辈子没答上来。）'
    choices:
    - text: 再走一遭这条路
      goto: '@restart'
  hushi.end-sacrifice:
    title: 结局 · 为国家牺牲了
    text: '你接了。

      二十一年的独立自由的生活，今日起，为国家牺牲了。

      ——你写下这句话的时候，用的是记日记的笔，不是起草公文的笔。

      此后四年，你在美国各处演说。你讲中国的抗战，讲民主与集权，讲一个还没打完的国。

      你数不清讲了多少场。有一次你在一个小城的扶轮社讲完，一个老太太上来握你的手，说她头一回知道中国在哪里。

      那四年你瘦了很多，头发白了很多。你不再写诗，也很少写信。

      有人后来送你一句话：做了过河卒子，只能拼命向前。你听了没有否认。

      ——你没有回到那二十一年里去。

      可你把「牺牲了」三个字原样留在日记里，一个字也没有改。'
    choices:
    - text: 再走一遭这条路
      goto: '@restart'
  hushi.end-decline:
    title: 结局 · 均不能满意
    text: '你没有接。

      我总想辞卸大使事。但拟数电，均不能满意。

      ——你拟了一封又一封，每一封都写不好，因为你心里有两句话在打架：一句说国难严重，一句说二十一年。

      你后来没有再拟。你把那几封辞电都留着，一张也没有撕。

      〔虚构分支〕史实是他在一九三八年九月赴任；这一条写的是「如果他始终没有拟出那封令自己满意的电」。

      ……

      往后的很多年里，你偶尔会想起那几张纸。

      你想起的不是「我保全了什么」，而是：一个人可以为了守住自己的二十一年，把另一个更大的东西推出去多远。

      这个问题你也没有答。

      你只是把纸留下了。有些东西你没做成，但你留了底。'
    choices:
    - text: 再走一遭这条路
      goto: '@restart'
  hushi.end-deserter:
    title: 结局 · 逃兵
    text: '你上了那条船。

      南京作「逃兵」，作难民，已十七日了！

      ——这句话是一月一日写的，你当时写的不是别人。

      〔虚构分支〕史实是他送冬秀赴台、自己留下；这一条写的是「如果他跟着上了船」。

      ……

      船离岸的时候天还没亮。你没有站在甲板上。

      你在舱里把那部没校完的《水经注》摊开，校了三页，一个字也没看进去。

      很多年以后还有人这样叫你。你没有辩过。

      你只是一校再校，校到八十岁还没校完。

      ——逃兵两个字，你没有删。'
    choices:
    - text: 再走一遭这条路
      goto: '@restart'
  hushi.end-stay:
    title: 结局 · 留下
    text: '你留下了。

      送冬秀上船那天，码头上人很多。她上船之前没有说什么，你也没有。

      后来你在这一页的边上补了一行小字：不意一月八日夜是最后一次见蒋公！

      ——你补这行字的时候，已经过了那一夜。你已经知道那是最后一面了，而当时不知道。

      人这一辈子，有多少话是当时不知道该说的。

      ……

      你还留着那张牛奶收据。四百四十元，三十一瓶牛奶，民国三十五年十月。

      冬秀想不起它怎么漂过海来，你也没有告诉她：是你夹在书里带出来的。

      〔分支收束〕你没有变成任何一种人——不是诤臣，不是大使，不是逃兵。

      你只是留下了。你一直都在。'
    choices:
    - text: 再走一遭这条路
      goto: '@restart'
  hushi.end-remonstrator:
    title: 结局 · 诤臣一百人
    text: '「总统」必须有诤臣一百人，最好有一千人。开放言论自由，即是自己树立诤臣千百人也。

      ——你说完这句，他居然容受了。

      他甚至还问你：召开国民大会有什么事可做？这一届国大可以两次选「总统」吗？

      末了他说：请你早点回来，我是最怕开会的！

      这最后一段话颇使我惊异。难道他们真估计可以不要宪法了吗？

      ……

      你没有等到答案。

      你只做了一个诤臣能做的一件事：把话说出来，让它留在纸上。

      一百人，一千人。你一个人也做了一阵子。'
    choices:
    - text: 再走一遭这条路
      goto: '@restart'
  hushi.end-cards:
    title: 结局 · 过五关（真结局）
    text: '第二次，你用地牌做「配」。

      这回过了。你把三十二只天九牌一只一只收起来，收得很慢。

      ——你想起一九一四年那个秋天的下午，韦莲司问你的那句话：

      若吾人所持见解与家人父母所持见解扞格不入，则吾人当容忍迁就以求相安乎？抑将各行其是，虽至于决裂破坏而弗恤乎？

      你当时的回答是：吾于家庭之事，则从东方人；于社会国家政治之见解，则从西方人。

      ——你一辈子都在同时做这两件事：为爱我者屈，又不为任何人屈。

      这两件事从来没和解过。可你做了整整一辈子。

      ……

      记者告辞的时候，你送到门口，微笑着对他说：

      你老远的赶来，关于雷案我只有六个字的感想：「大失望，大失望。」你这样辛苦一趟，恐怕也是大失望吧！

      ……

      记者独自伫立在石阶上回头看看，想想这位独居在里面的一代学人，他的一举一动、一言一语所露出的神情，才体会到——

      人到相对无言时，是怎样的一种况味。'
    choices:
    - text: 再走一遭这条路
      goto: '@restart'
