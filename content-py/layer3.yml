# 由 scripts/migrate/json2yaml.py 从 content/layer3.js 转换
# （条件表达式已转 Python 语法；业务内容原样，未人工校对）
scenes:
  layer3.start:
    title: 古堡 · 更深处
    text: '你听说了，古堡地下层之下，还有第三层。

      守门的老管家给你指了条路：地下层最东边的墙，有一块砖是松的。你找到那面墙，撬开松动的砖——后面是一道极窄的石阶，往下，黑得没有底。

      风从石阶下涌上来，热烘烘的，带着一股陈年的炭气。

      你举着火把，一脚踏了下去。'
    choices:
    - text: 沿石阶往下走
      goto: layer3.ash
  layer3.ash:
    title: 第三层 · 灰烬
    text: '石阶尽头，是一片灰烬层。

      地上铺着厚厚的白灰，脚踩下去，无声地陷进去。四壁都是焦黑的，像被火烧过一百遍。

      灰里有东西。你拨开看，是些烧剩下的木模、铁渣、几截断了的剑形——都小，像试铸的废品。

      远处的黑暗里，有风箱的声音，一下，又一下。'
    choices:
    - text: 顺着风箱声，往旧锻炉去
      goto: layer3.forge
    - text: 先看看灰里还埋着什么
      goto: layer3.ash.dig
  layer3.ash.dig:
    title: 第三层 · 灰下
    text: '你在一处灰薄的地方挖下去，碰到一块铁牌。擦去灰，上面刻着一行小字："铸剑三百，成者一。余皆封此。"

      再挖，又翻出半截剑胚，剑脊上一道裂——和古堡里那半截断剑的裂口，一模一样。

      原来那柄剑，不是头一回断。'
    choices:
    - text: （铸剑三百，成者一——记下了）
      goto: layer3.forge
  layer3.forge:
    title: 第三层 · 旧锻炉
    text: '旧锻炉还热着。炉膛里没有一点火，可整座炉像块烧红的石头，烫得没法靠近。

      风箱挂在炉边，风箱的皮囊破了，正自己一开一合——像有什么看不见的东西，还在拉它。

      炉前的铁砧上，放着一柄没成形的剑胎，胎身上全是锤痕，密密匝匝。'
    choices:
    - text: 去铁链室看看
      goto: layer3.chains
    - text: 把剑胎放回炉里
      goto: layer3.forge.touch
  layer3.forge.touch:
    title: 第三层 · 炉火
    text: '你把剑胎放回炉里。

      炉膛深处，"腾"地亮起一点暗红。那点火不热，反而冷，冷得你的手背起了一层霜。

      剑胎在炉里慢慢变红，又慢慢变黑。你听见炉子里有声音，像剑在哭，又像很多剑在哭，一声叠着一声，从炉膛深处漫上来。'
    choices:
    - text: （这炉子，认剑）
      goto: layer3.chains
  layer3.chains:
    title: 第三层 · 铁链室
    text: '铁链室里，墙上钉着十几道铁链，链头都有空镣铐，磨得发亮。

      地上散着些石头粉末，还带着爪痕——很深，从墙上一直刮到门口，像有什么东西被拴了千年，一夜挣脱。

      你想起堡里那些石像鬼：这镣铐，是不是拴过它们？那它们，又是什么东西变的？'
    choices:
    - text: 往祭台去
      goto: layer3.altar
    - text: 细看那些爪痕
      goto: layer3.chains.look
  layer3.chains.look:
    title: 第三层 · 爪痕
    text: '爪痕有五道，深浅不一，最深的一道抠进石头里半寸。

      痕里凝着些发亮的东西，像鳞片，又像泪。你想起地下层那具石棺，棺盖上像人又像鸟的怪相——爪子的形状，和这痕，分毫不差。

      石像鬼不是雕出来的。它们是变出来的。'
    choices:
    - text: （石棺里的怪相，来过这层）
      goto: layer3.altar
  layer3.altar:
    title: 第三层 · 祭台
    text: '祭台是一整块黑石，台上刻满了符——和建堡年代老祭师画的符，是同一种。

      台心有一个凹槽，剑形。凹槽里是空的，可槽底积着一层发亮的细沙，风吹不动。

      台边的石壁上，用炭条写着一行字："封剑者，护人；焚层者，绝患；开台者，放它。"'
    choices:
    - text: 往最深处去——燃薪核心
      goto: layer3.core
  layer3.core:
    title: 第三层 · 燃薪核心
    text: '核心是一间穹顶的石室。室中央，一尊石像蹲着，半人半鸟，双翅收拢，眼睛的位置是两条细缝。

      你走近一步，那两条缝里，忽然透出一线暗红——它没醒，可它在看你。

      你怀里那半截断剑（若你带在身上）微微发烫。石像的爪子，慢慢张开了一道缝。'
    choices:
    - text: 把断剑放进祭台的凹槽——再封一次
      if: items.broken_sword >= 1  or  items.rusty_sword >= 1
      goto: layer3.end-seal
    - text: 点燃这层——灰烬与炭，一起烧绝
      goto: layer3.end-ash
    - text: 凿开祭台——它等得太久了，放它
      goto: layer3.end-free
  layer3.end-seal:
    title: 结局 · 再封印
    text: '你把断剑放进了祭台的凹槽。

      剑落下去，"铮"地一声，槽底的细沙腾起来，绕着剑转了三圈，落定。石壁上的符一道道亮起来，红光从祭台漫出去，一层一层，封住了整座第三层。

      那尊石像眼缝里的暗红，一点一点暗下去。它的爪子合拢了，像在梦里叹了一口气。

      你退出来时，那面松动的砖，自己合上了。

      古堡还是古堡。剑，回到了它该在的地方。'
    choices:
    - text: 再走一遭这古堡
      goto: '@restart'
  layer3.end-ash:
    title: 结局 · 焚层
    text: '你点燃了这层。

      灰烬先烧起来，然后是炭、铁渣、断剑的残片。大火顺着石阶往上卷，把整座第三层烧成了一口通红的炉膛。

      你退到地下层，听见底下传来一声尖啸，又长又利，像什么东西被烧成了灰。

      火熄后，第三层的入口塌了。石像鬼的源头，彻底绝了。

      从此古堡里的石像，再没在夜里动过。'
    choices:
    - text: 再走一遭这古堡
      goto: '@restart'
  layer3.end-free:
    title: 结局 · 释放
    text: '你凿开了祭台。

      黑石裂开，细沙涌出来，像一汪发亮的水，流得到处都是。那尊石像的眼缝猛地张开，暗红大盛——它醒了。

      它没有攻击你。它只是站起来，抖了抖翅膀，朝你看了一眼，然后顺着石阶，一步一步，走了出去。

      那一夜，古堡里的石像鬼全都活了。它们排着队，走出古堡，走进了北山的夜色里。

      从此，北山多了一群夜行的东西。有人说它们守着山，有人说它们找人。

      你站在地下层的入口，手里还握着凿子。

      你放出去的，是建堡者封了千年的东西。是祸是福，还没人知道。'
    choices:
    - text: 再走一遭这古堡
      goto: '@restart'
