# 由 scripts/migrate/json2yaml.py 从 content/starport-echo.js 转换
# （条件表达式已转 Python 语法；业务内容原样，未人工校对）
scenes:
  echo.start:
    title: 星港 · 第七码头
    text: '你回到第七星港的时候，正赶上码头上围着一圈人。

      港务调度长老贾的尸体刚从海里捞上来，脸泡得发白。当值的说，是夜里失足落水。

      可你认得老贾。第一桩案子的时候，是他深夜给你开的货舱门。这人脚底下稳了一辈子，码头上的潮汐表，他闭着眼都能背。失足？

      码头上，一个瘦高的年轻人正张罗着善后，嗓门洪亮："都散了都散了，意外，没什么好看的。"'
    choices:
    - text: 你站住了——这案子，你想再看看
      goto: echo.hub
  echo.hub:
    title: 调查板 · 第七码头案
    text: '你在码头的货棚里支了张临时案卷桌。老贾的调度册、当夜的潮汐表，还有几块从岸边捡来的东西，摊在油布上。

      那个张罗善后的年轻人叫小崔，老贾的副手，此刻正隔着人群朝这边望。你招了招手，他又低头去忙了。

      星港的旧案你办过两桩。这一桩，像旧浪头打回来的回声——你得先看清浪从哪里来。'
    choices:
    - text: 去码头现场，看老贾落水的地方
      goto: echo.dock
    - text: 去调度室，翻老贾的调度册
      goto: echo.office
    - text: 去找副手小崔问话
      goto: echo.clerk
    - text: 去找当夜的船员问话
      goto: echo.crew
    - text: 去港务账房，翻近月的账
      goto: echo.ledger
    - text: 去码头黑市，问收赃的人
      goto: echo.market
    - text: 去灯塔，找守望的老头
      goto: echo.beacon
    - text: 去港务借潮汐表，对那夜的水位
      if: echoClues.dock >= 1
      goto: echo.tide
    - text: 证据够了——叫齐码头的人，当面问案
      if: flags.echo.autopsy
      goto: echo.accuse
  echo.dock:
    title: 现场 · 第七码头
    text: '老贾落水的地方在码头最东头，那里白天也没人走。你蹲下看：石沿上有两道新鲜的拖拽痕，从一盏系缆桩一直拖到水边。

      地上还散着几片纸，被水泡得半烂。你捡起一片，是调度单的角——上面的字已经洇了，只认出半个"崔"字。

      老贾落水是后半夜。那时候，谁会在码头最东头拖东西？'
    choices:
    - text: 记下：东头有拖拽痕，调度单碎片带"崔"字
      if: not echoClues.dock
      do:
        echoClues.dock: 1
      goto: echo.hub
  echo.office:
    title: 调度室 · 老贾的册子
    text: '调度室里，老贾的调度册还摊在案上，最后几页被撕走了。你翻了翻：近半个月，第七码头夜里多出好几班"空船"记录，班班都有老贾的签名。

      可最后一页的签名，墨色比前头的都新，笔锋也飘——像有人照着他的字描的。

      "老贾的字，收笔都重。"看门的老头凑过来说，"这几页的签名，收笔轻飘飘的。"'
    choices:
    - text: 拓下调度册最后几页的签名（铁证：笔迹伪造）
      if: not echoClues.slip
      do:
        echoClues.slip: 1
        echoEvidence: 1
        flags.echo.autopsy: true
      goto: echo.hub
    - text: 记下：夜里多出空船班次，签名可疑
      goto: echo.hub
  echo.clerk:
    title: 问话 · 副手小崔
    text: '小崔二十五六岁，说话利索，两只手总在裤缝上蹭。

      "老贾是我师父。"他眼睛红红的，"昨晚我在宿舍睡觉，一觉到天亮。今早码头的人来喊，我才知道他……"

      你问他昨夜谁最后见的调度长。他想了想："夜里十一点，我给他送过一回夜宵，就着调度室的灯，他还在对班次。"

      他说完，飞快地看了你一眼，又补了一句："老贾这人，就是太较真。班次多一分少一分，他都要查到半夜。"'
    choices:
    - text: 记下：小崔说十一点见过老贾，说老贾"太较真"
      if: not echoClues.clerk
      do:
        echoClues.clerk: 1
      goto: echo.hub
  echo.crew:
    title: 问话 · 当夜船员
    text: '当夜值更的船员老何，是个黑瘦的老头，在第七码头干了二十年。

      "后半夜三点，我巡到东头，看见个人影往水边拖东西。"老何压着嗓子，"雾大，看不清脸。身形不高不矮，不胖不瘦。"

      你问他在拖什么。他摇头："看不清。后来听见扑通一声。我寻思是谁扔的缆绳，没敢凑近。"

      老何搓着手："这码头，夜里的事，看见了也当没看见。这是老规矩。"'
    choices:
    - text: 记下：老何三点见人拖物，扑通一声
      if: not echoClues.crew
      do:
        echoClues.crew: 1
      goto: echo.hub
  echo.ledger:
    title: 账房 · 港务账
    text: '港务账房的老账房把近月的账都搬了出来。你翻到调度项：夜里那几班"空船"，报的是检修，走的是停泊费——可第七码头东头没有泊位，检修什么？

      老账房推了推眼镜："这些班次，都是小崔来报的。老贾不常来账房。"

      账本最底下，夹着一页没归档的纸，上头记着几笔分账，收钱的一方，写着一个"崔"字。'
    choices:
    - text: 记下：空船检修走停泊费，分账页有"崔"字（铁证：走私分账）
      if: not echoClues.account
      do:
        echoClues.account: 1
        echoEvidence: 1
      goto: echo.hub
    - text: 记下：空船班次都是小崔报的
      goto: echo.hub
  echo.market:
    title: 黑市 · 收赃人
    text: '码头的黑市缩在一条窄巷里。收赃的老六正蹲在门槛上剔牙，见你来，往旁边让了让。

      "近半月，有批货从第七码头进来，走的夜船。"老六用牙签点点地，"货我见过，是管制零件。经手的人我认得——调度长身边那个小白脸。"

      他伸出两根手指："小崔。这小子胆子大，吃两家，港务的码头费，黑市的过路费，都敢沾。"'
    choices:
    - text: 记下：小崔走私管制零件，吃两家
      if: not echoClues.market
      do:
        echoClues.market: 1
      goto: echo.hub
  echo.beacon:
    title: 灯塔 · 守望者
    text: '灯塔守望者是个半聋的老头，灯塔的灯罩擦得一尘不染。

      "那夜灯塔的灯扫过东头三次。"老头比划着，"头一回，码头上站着两个人，像在说话。第二回，一个人走了。第三回——就剩一个人蹲在水边，在洗什么东西。"

      你问他看清人没有。他摇头："灯扫得快。只看见蹲着的那个，穿的是港务的蓝制服。"

      港务的蓝制服，调度室人人都穿。'
    choices:
    - text: 记下：那夜东头两人说话，一人先走，一人蓝制服洗东西
      if: not echoClues.beacon
      do:
        echoClues.beacon: 1
      goto: echo.hub
  echo.tide:
    title: 勘验 · 潮汐表
    text: '你借了港务的潮汐表，一页页对。老贾落水那夜，三点前后正是退潮——水线该往码头外头退。

      可尸身被发现时，搁在东头水边往上的一处平台上，那里是涨潮才淹得到的位置。退潮时落水的人，尸身该往外漂，不该往高处搁。

      除非——他不是在退潮时落的水，或者，是有人在水退下去之后，把他搬到那儿的。'
    choices:
    - text: 记下：退潮落水、涨潮位发现，尸身被人搬动过（铁证：非失足）
      if: not echoClues.tide
      do:
        echoClues.tide: 1
        echoEvidence: 1
      goto: echo.hub
  echo.accuse:
    title: 问案 · 码头货棚
    text: '你叫齐了码头的人，货棚里挤得满满当当。老贾的调度册、潮汐表、分账页，一样一样摆在油布上。

      小崔站在人前，还是那副利索样子，可裤缝上的手，已经不动了。

      "调度长落水那夜，退潮。尸身却搁在涨潮位上。"你环视一圈，"失足？水不认这个账。"'
    choices:
    - text: 当众亮出实证，指认副手小崔
      if: echoEvidence >= 2
      goto: echo.end-truth
    - text: 指着小崔：「是你！」——可你手里证据不足，心里发虚
      if: echoEvidence < 2
      goto: echo.end-wrong
    - text: 指着当夜值更的老何：他三点在码头，形迹可疑
      goto: echo.end-wrong
    - text: （你攥了攥油布上的纸——还是没有十足把握）这案子，再议吧
      goto: echo.end-open
    - text: 你指了小崔，却在最后摆了摆手：让他走——旧案的账，你心里有数
      if: echoEvidence >= 2
      goto: echo.end-echo
  echo.end-truth:
    title: 结局 · 回声落地
    text: '你把三样东西摆上案。

      "第一样，调度册最后几页。夜里多出的空船班次，签的是老贾的名——收笔却轻飘飘的。老贾的字，收笔重。这是描的。"

      "第二样，潮汐表。退潮时落的水，尸身却搁在涨潮位。有人在水退之后，把他搬了上去。"

      "第三样，账房夹着的分账页。管制零件走私，收钱的一方，姓崔。"

      小崔的脸色一点一点白下去。老何在一旁叹了口长气。

      小崔被港务司带走了。老贾的调度册补齐了最后几页——那几页上，每一班空船都被划掉了。

      码头的夜船照旧开。可第七码头东头那盏系缆灯，从此夜夜亮着。老何说，是老贾夜里还来对班次。

      这桩案子落了地。浪打回来的时候，回声总得有个落处。'
    choices:
    - text: 再走一遭这星港
      goto: '@restart'
  echo.end-wrong:
    title: 结局 · 冤
    text: '你的证据不够，话却已经出了口。

      被指的人被港务司带走时，你看见小崔站在人群后头，嘴角动了一下，像笑，又不像。

      案子以"因私泄愤"结了。可码头上的人心里都有杆秤——他们记得老贾的较真，也记得你指认时，油布上的纸被风吹起来，哗啦响。

      很多夜里，东头的系缆灯还是亮着。老何说，是老贾放不下。

      你后来再没去过第七码头。星港的回声，有落得对的，也有落得错的。'
    choices:
    - text: 再走一遭这星港
      goto: '@restart'
  echo.end-open:
    title: 结局 · 悬案
    text: '你终究没指认任何人。

      案子挂了起来。港务司给老贾报了"因公失足"，抚恤金发得痛快。码头恢复了平静，夜船照开，调度室换了新册子。

      小崔升了调度长。他上任第一天，把东头那盏系缆灯拆了，说是费电。

      可老何说，后来每个退潮的夜里，东头都有扑通一声响，像有人往水里扔东西，又像有人从水里往外拖东西。

      星港的浪头打来打去。有些案子，悬着，就是它的答案。'
    choices:
    - text: 再走一遭这星港
      goto: '@restart'
  echo.end-echo:
    title: 结局 · 回声
    text: '你指了小崔，却在最后摆了摆手："让他走。"

      满棚的人都愣住了。老何张了张嘴，又闭上了。

      你没解释。可你心里清楚：第一桩案子的时候，也有人证据不足就放了人；第二桩案子的时候，也有人拿钱买走了真相。这星港的回声，一浪叠一浪，你抓得住这一浪，抓不住下一浪。

      小崔走了。听说他后来辞了港务的差，去了别的港。夜里，第七码头东头再没亮过灯。

      老贾的调度册，你悄悄收走了最后几页，夹在自己的案卷里。纸会黄，字会淡。可你每次翻到，都听见那夜的海浪，一遍一遍，打回岸边。

      回声不会停。它只是换了个地方响。'
    choices:
    - text: 再走一遭这星港
      goto: '@restart'
