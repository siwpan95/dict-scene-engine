# 由 scripts/migrate/json2yaml.py 从 content/town-trade.js 转换
# （条件表达式已转 Python 语法；业务内容原样，未人工校对）
scenes:
  town.start:
    title: 东市 · 老字号「三合铺」
    text: '东市的清晨从卸板声开始。你站在一家铺子前，招牌上「三合铺」三个字掉了漆。

      老掌柜姓何，头发白得发亮。他把你请进堂屋，沏了壶茶，慢慢开口：「我老了，干不动了。铺子盘给谁都行，但我不愿它败在不懂行的人手里。」

      「这样——你替我试营五天。本钱，我出二十金添给你，加上你手头的，凑一份货底。货从市上现进现卖。五天之后，净赚够翻一番，这铺子就归你；赚不出名堂，你我缘分就到这儿。」

      他推过来一本泛黄的货册，茶、盐、布，进价写得清清楚楚。'
    choices:
    - text: 接过铺子，先开张试试
      do:
        gold: 20
      goto: town.shop
    - text: 先不急着开张，到市面上去转转
      do:
        gold: 20
      goto: town.recon
  town.recon:
    title: 东市 · 市面
    text: '东市的市面还没全醒，茶馆的炉子先热了，一个老头蹲在墙根看云，布告栏前已经围了一圈人。

      你盘算着：五天说长不长，货进错了、日子押错了，本钱就见底。先听听市面上的风，再决定怎么进。'
    choices:
    - text: 进茶馆听茶客闲谈
      if: not flags.knowTeaFair
      goto: town.tea
    - text: 找那个看云的老头搭话
      if: not flags.knowRain
      goto: town.rain
    - text: 挤到布告栏前看告示
      if: not flags.knowMarket
      goto: town.notice
    - text: 回铺子开张
      goto: town.shop
  town.tea:
    title: 东市 · 茶馆
    text: '茶馆里坐的净是跑货的掮客。你买了几文茶点，耳朵竖着听。

      「听说了吗，初三是灯会，南城茶行办斗茶。」「那茶价还不得飞？」「飞什么，老规矩——斗茶那天茶行让利聚人气，散茶平价出，就那一天。」

      你把这话记下：试营的第三天，茶行斗茶，茶价看涨。进茶，就押那一天出。'
    choices:
    - text: 记下茶会的日子，回市面
      if: not flags.knowTeaFair
      do:
        flags.knowTeaFair: true
      goto: town.recon
  town.rain:
    title: 东市 · 看云的老头
    text: '老头姓柳，一辈子给货栈看天。你蹲下来，给他递了支烟——他不抽，只眯眼看天。

      「明日有雨，雨还不小。盐怕潮，可盐也靠雨——下雨天晒盐的滩子停工，盐价得抬一抬。」

      「后天就晴。要押盐，就押明天，过了明天价就落回原处。」'
    choices:
    - text: 记下明天下雨，回市面
      if: not flags.knowRain
      do:
        flags.knowRain: true
      goto: town.recon
  town.notice:
    title: 东市 · 布告栏
    text: '布告栏上贴着一张新告示：五日后西市开大集，四方行商云集，布匹绸缎按例免半税。

      旁边卖馄饨的大娘补了一句：「每回大集，布价都能翻一番。你手头要是有布，别早卖，等大集。」

      你把告示上的日子和试营的日子对了一遍——正好是第五天。'
    choices:
    - text: 记下大集的日子，回市面
      if: not flags.knowMarket
      do:
        flags.knowMarket: true
      goto: town.recon
  town.shop:
    title: 东市 · 三合铺
    text: '铺子开了板，货架擦得发亮。何掌柜坐在后堂，只喝茶不说话——五天试营，他只看结果。

      货册摊在柜上：茶进价 8 金，盐进价 4 金，布进价 2 金。每样货每天的行市都不同，买低卖高，全看你的眼力。

      （用 buy 进货、sell 出货、next 过到下一天；第 5 天收市后结算。）'
    mode: trade
    trade:
      name: 东市
      days: 5
      onEnd: town.settle
  town.settle:
    title: 东市 · 收市盘账
    text: '第五天收市，何掌柜把算盘拨得山响。

      「进铺时多少，出铺时多少，净赚——」他抬头看了你一眼，「{tradeProfit} 金。」

      堂屋里静得能听见灯花响。五天前他给了你一家掉漆的铺子和二十金添头，现在轮到你给个交代。'
    choices:
    - text: 把荒漠带回来的铜符卖给他识货的朋友（+30 金）
      if: items.relic_charm >= 1  and  not flags.relicSold
      goto: town.relic
    - text: 请何掌柜裁断
      goto: town.judge
  town.relic:
    title: 东市 · 铜符
    text: '你把那枚从荒漠石堡里带出来的铜符放在柜上。何掌柜的眼神变了。

      「这是西边古商道的行商符，见符如见联号。我有个老朋友，收这个收了半辈子。」他沉吟片刻，「三十金，我替你牵线。成不成，你自己定。」

      铜符在灯下泛着暗光，人面上那点笑，像在问你：这一路带它来，值不值三十金。'
    choices:
    - text: 卖了它（+30 金）
      if: not flags.relicSold
      do:
        gold: 30
        items.relic_charm: -1
        flags.relicSold: true
      goto: town.settle
    - text: 不卖，留作念想
      do:
        flags.relicKept: true
      goto: town.settle
  town.judge:
    title: 东市 · 何掌柜裁断
    text: '何掌柜盯着算盘看了很久，最后把算盘轻轻一推。

      「做买卖，一靠眼力，二靠日子。眼力看货，日子看天——你把这两样都摆在这五天里了。」

      他站起身，走到你面前，像要把你这个人也盘算进去，连着这五天来的每一笔进出。'
    choices:
    - text: （听结果）
      if: tradeProfit >= 60
      goto: town.end-rich
    - text: （听结果）
      if: tradeProfit >= 10  and  tradeProfit < 60
      goto: town.end-mid
    - text: （听结果）
      if: tradeProfit < 10
      goto: town.end-poor
  town.end-rich:
    title: 结局 · 东市 · 商会入主
    text: '「净赚六十金往上，还带着我教不出的活络。」何掌柜把铺契推到你面前，又添了一份红柬。

      「西市大集的管事今天来找过你，说你押布那一手，整个东市都传开了。他请你入商会，管一条街的货。」

      后来，「三合铺」的招牌换成了新的，隔壁两间铺面也归了你。何掌柜每天仍来喝茶，坐在后堂，笑眯眯地看着你自己当老板。

      （GOOD END · 五天试营，你让东市记住了你的名字）'
    choices:
    - text: 再玩一次
      goto: '@restart'
  town.end-mid:
    title: 结局 · 东市 · 小本营生
    text: '「净赚十金上下，够本还带点利。」何掌柜点点头，「你没让我亏，也没让我惊喜——但你没亏，就是能在这行站住脚的人。」

      他把铺契收进怀里：「铺子我再撑两年。等你想明白了行市的门道，再来接。」

      你离开东市时，天还没黑。回头看一眼那掉漆的招牌，心里想的是：下一回，五天的货，第一天就该全押对。

      （NEUTRAL END · 你没输，但也没赢下这间铺子）'
    choices:
    - text: 再玩一次
      goto: '@restart'
  town.end-poor:
    title: 结局 · 东市 · 铺子没保住
    text: '「十金都赚不到。」何掌柜的声音很轻，像怕伤着你。

      「本钱折了，铺子我另找人盘。你——」他顿了顿，「你是个实诚人，但不是吃这碗饭的料。去寻别的营生吧，别糟蹋了自己。」

      你走出三合铺，卸板声在身后落下。三十金本钱，五天市声，最后只换回一句实话。

      （BAD END · 行市如刀，没看准日子的人先出局）'
    choices:
    - text: 再玩一次
      goto: '@restart'
