# 由 scripts/migrate/json2yaml.py 从 content/lantern.js 转换
# （条件表达式已转 Python 语法；业务内容原样，未人工校对）
scenes:
  lantern.start:
    title: 夜巷 · 一盏孤灯
    text: '你是夜行的货郎,错过了宿头,在城东深巷里撞见一盏灯——不像寻常人家,那灯挂在门楣下,纸面泛着旧旧的暖黄,风里微微晃,像是在招呼过路的人。

      门楣上悬着一块木牌,漆都斑驳了,只认得出两个字:千灯。

      门虚掩着,檐下挂着一排灯笼,大小不一,却都亮着。你站在巷口看了半晌,竟觉得那些灯,一盏盏都像在等你进去。'
    choices:
    - text: 推门进去,看看这间深夜还亮着的灯笼铺
      goto: lantern.shop
    - text: 先在檐下看看那些灯,等里面的人应声
      goto: lantern.ask
  lantern.shop:
    title: 千灯铺 · 铺内
    text: '铺子里没有柜台,四壁挂满灯笼,案上摊着竹篾与半干的红纸,浆糊的味儿混着蜡香。一个阿婆坐在灯下扎灯笼,手上的活计不停,头也不抬:

      「客官是要买灯,还是要许愿?」

      你这才看清,墙角有两盏灯与别的不同:一盏系着褪色的红绳,绳上拴着小小的木牌,写满名字;另一盏做成河灯的样子,纸面被水汽洇过,却还亮着。

      「这铺子里的灯,记得人。」阿婆说。'
    choices:
    - text: 问阿婆:灯怎么会记得人?(听铺子的来历)
      goto: lantern.ask
    - text: 看看那盏系着红绳的灯
      if: not flags.lantern.red
      goto: lantern.red
    - text: 看看那盏河灯
      if: not flags.lantern.river
      goto: lantern.river
    - text: 夜渐深——你与阿婆面对面坐下
      goto: lantern.night
  lantern.ask:
    title: 千灯铺 · 来历
    text: '阿婆放下手里的活,从案下摸出一盏旧灯,纸面发黄,边角却护得齐整。

      「我年轻时,也在外头走。有一年冬天,雪大,我病倒在一间灯笼铺门口,是铺子的老掌柜把我捡回去的。他说,灯笼铺卖的不是灯,是灯下等的那些人。」

      「老掌柜走的那年,把他的灯留给了我。灯芯是活的——它记得每一个许愿人的手温。谁许了愿,灯就替他记着,直到愿望了了,灯自己就暗下去。」

      她看你一眼:「外乡人,你也有想让它记着的事吧。」'
    choices:
    - text: 回到铺中看灯
      goto: lantern.shop
    - text: 看那盏系着红绳的灯
      if: not flags.lantern.red
      goto: lantern.red
    - text: 看那盏河灯
      if: not flags.lantern.river
      goto: lantern.river
  lantern.red:
    title: 红绳灯 · 等归人
    text: '红绳灯比别的灯矮半尺,灯骨上缠着旧绳,绳上的小木牌一面刻着一个名字。你数了数,牌子上叠着新的旧的,字迹各不同——是许多只手挂上去的。

      阿婆说:「出远门的人,家里人就给他挂一盏。灯芯朝哪个方向斜,人就在哪个方向;灯灭了,人也就真到家了。」

      她递给你一段新绳,和一块空白的小木牌。窗外不知哪家的更鼓,敲过了三更。'
    choices:
    - text: 在牌上刻下一个「归」字,系到灯下
      do:
        flags.lantern.red: true
      goto: lantern.shop
    - text: 把木牌翻到空白一面——替所有还没回家的人挂上
      do:
        flags.lantern.red: true
      goto: lantern.shop
  lantern.river:
    title: 河灯 · 渡故人
    text: '河灯搁在一只盛了清水的木盆里,纸面微微起伏,像真在水上。灯里没有烛,却有一点幽幽的光,映得盆底的石子都看得清。

      「故去的人,走水路。」阿婆说,「放一盏灯下去,灯会逆着水漂一小段,像是送他最后一程。水到了头,灯就灭了——那是他收着了。」

      她从柜下取出一盏未点的新河灯,纸是素白的,等你写点什么。夜风从门缝钻进来,灯里的光晃了晃,没有灭。'
    choices:
    - text: 在灯面上写下一个名字,放进盆里,看它逆流
      do:
        flags.lantern.river: true
      goto: lantern.shop
    - text: 不写名字,只把灯放进水里——送给所有无名无姓的赶路人
      do:
        flags.lantern.river: true
      goto: lantern.shop
  lantern.night:
    title: 千灯铺 · 三更
    text: '你在铺里坐到三更。阿婆烧了壶水,给你倒了一碗,自己也端一碗,两个人就着灯影,听巷子外的风。

      「我这铺子,传了三代了。」她说,「灯认得人,人却不常认得灯。年轻人都往城里走,没人再学扎灯,也没人再信灯会记事了。」

      她看着满墙的灯,目光比灯还亮:「我老了,灯得有人守着。守着灯的人,不是卖灯——是替那些许了愿又走远了的人,把灯亮着,别让愿望凉了。」

      她没再看你,像是自言自语,又像是问。'
    choices:
    - text: 留下来,接这间千灯铺(守住每一盏灯和愿望)
      goto: lantern.end-keep
    - text: 提着阿婆给的那盏引路灯,替她把灯送到更远的路口
      goto: lantern.end-carry
  lantern.end-keep:
    title: 结局 · 守灯人
    text: '你在千灯铺留了下来。头一个月,你把阿婆的旧账册誊了一遍,发现那些红绳上的名字,有的已经灭了几十年——可挂灯的人,每年还在添新的绳子。

      你学着扎灯、糊纸、调蜡。扎坏了几十盏之后,第一盏能稳稳亮到天明的灯,你挂在门楣上,和当年那盏一样的位置。

      巷子里的人渐渐知道,深巷尽头那间铺子又有人守着了。出远门的人来挂红绳,送故人的人来放河灯,偶尔有赶夜路的人进来讨口水,你也不问姓名,只顺手给他亮一盏灯。

      很多年后,有个年轻人站在铺子门口,像你当年一样犹豫。你从案下摸出那盏阿婆留给你的旧灯,说:「进来吧。这铺子里的灯,记得人。」

      墙角的红绳灯又添了一块新木牌。灯芯朝南,晃了晃,像在应一声「回来了」。'
    choices:
    - text: 再走一遭这夜里的路
      goto: '@restart'
  lantern.end-carry:
    title: 结局 · 送灯人
    text: '阿婆没有拦你。她从满墙的灯里,取下那盏灯骨最老的,交到你手上:「这是我师父传给我的。你带着它走,路上遇见走夜路的人,就给他照一照;遇见挂念的人,就替他亮一亮。」

      你天亮出的城。那盏灯收在行囊里,你走夜路时摸到它,纸面竟是温的。

      后来你走了很远:在山道给迷路的孩子亮过灯,在渡口给等船的老人亮过灯,在一户办丧事的人家门口,你放下过一盏素白的河灯,看它顺水漂远。灯芯斜向哪个方向,你就往哪个方向多走一程,像替什么人,把没走完的路走完。

      你始终没再回过那座城。可你夜里歇脚时,偶尔会梦见那间铺子:门楣的灯还亮着,阿婆坐在灯下扎灯笼,抬起头来,像是对你,又像是对满墙的灯说——

      「路上有人亮着灯,家就有人记得。」

      你行囊里那盏灯,到现在还亮着。'
    choices:
    - text: 再走一遭这夜里的路
      goto: '@restart'
