# 字典场景引擎 · 插件清单
# 每个条目 = 一个 Cordis 插件实例（id 用于定位，name 是模块路径）
# 相对路径基于本文件所在目录解析；改这里即可开关插件/换内容包，无需改代码。
#
# 依赖注入由 Cordis 自动编排：engine 声明 inject: [scenes, state, io]，
# 全部就绪后才会启动，无需手动控制加载顺序。

- id: logger
  name: '@cordisjs/plugin-logger-console'
  config:
    colors: false            # Windows 控制台关闭 ANSI 颜色，避免乱码
    showTime: 'HH:mm:ss '

- id: timer
  name: '@cordisjs/plugin-timer'   # HMR 插件的防抖依赖（官方 hmr 需要）

- id: scenes
  name: ./plugins/scenes.js
  config:
    packs:                    # 场景字典内容包（支持多个，后者覆盖前者同 ID 场景）
      - ./content/demo.js
      - ./content/starport.js
      - ./content/starport-case.js   # M3：侦探 Mod《星港迷案》
      - ./content/demo-deep.js       # M4：古堡主线深化（地下层 + NPC + 新结局）
      - ./content/starport-case2.js  # M5：侦探第二案《港湾连环案》
      - ./content/caravan.js         # M6：新主线《荒漠商队》
      - ./content/town-trade.js      # M8：城镇经营 Mod《东市经营》
      - ./content/wuxia.js           # M9：武侠短篇《刀客》
      - ./content/scifi.js           # M9：科幻短篇《空间站疑云》
      - ./content/horror.js          # M9：恐怖短篇《古宅惊魂》
      - ./content/loop.js            # M11：时间循环短篇《子夜集》
      - ./content/post.js            # M12：情感短篇《驿路》
      - ./content/river.js           # M13：历史推理中篇《江畔·县志》
      - ./content/lantern.js          # AI-P0：《千灯》(由 AI 产线转换生成)
      - ./content/noodle.js           # AI-P1：《深夜面摊》(市井温情)
      - ./content/shadow.js           # AI-P1：《皮影班》(民俗志怪)
      - ./content/firefly.js          # AI-P1：《萤火巷》(童趣幻想)
      - ./content/hushi.js            # M14：新主线《藏晖室札记》(基于胡适日记 1911—1960)
      - ./content/snow.js             # M15：暴风雪山庄本格《雪庄·八客》(指认可错纠错)
      - ./content/crossing.js         # M15：同一夜多视角《渡口·子丑》(首个 dialogue mode 包)
      - ./content/garrison.js         # M15：双篇章历史《戍卒·家书》(记篇当下+忆篇追忆)
      - ./content/midnight.js         # M16：群像多视角《同一夜·十二时辰》(6 POV 时序锁)
      - ./content/ferry.js            # M17：跨世界观群像《渡口纪年》(四时四 POV 块茎网)
      - ./content/castle-pre.js       # M18：古堡前史 DLC《筑堡者》(三子祭剑之夜，本体已完整)
      - ./content/starport-echo.js    # M18：星港第二季 DLC《回声》(调度长溺毙案，本体已完整)
      - ./content/teahouse.js         # M19：情感中篇《茶肆·三遇》(双轴 trust/closeness)
      - ./content/gear.js             # M19：解谜中篇《机巧阁》(if/do+items 机关链)
      - ./content/water.js            # M19：末日生存短篇《最后的水》(水量资源管理)
      - ./content/grad.js             # M19：校园青春短篇《毕业那年》(关系 flag)
      - ./content/siege.js            # M20：双篇章历史长线《城破·记与忆》(记篇当下+忆篇繁华)
      - ./content/changan.js          # M20：历史都市主线《长安·西市》(多 hub 密信案)

- id: state
  name: ./plugins/state.js
  config:
    loopKeep:                 # M11：时间循环保留域（goto '@loop:' 时保留的知识，
      - clues.loop            #       其余状态回 initial。见 CONTENT-EXPANSION-PLAN §16）
      - flags.loop
    initial:                  # 玩家初始状态（战斗属性：atk/def/crit/maxHp）
      name: 旅人
      hp: 20
      maxHp: 20
      atk: 3                  # 基础攻击（+武器加成 = 实际 ATK）
      def: 2                  # 防御（每点抵消 defenseFactor 点伤害）
      crit: 0.15              # 暴击率
      gold: 10
      suspectLevel: 0        # 侦探 Mod：推理度（线索计数）
      clues:                 # 侦探 Mod：已掌握线索（clues.dock 等，必须先声明，
        loop: {}             #           否则条件表达式里会 ReferenceError）
      testimony: {}          #           M11 子夜集用 clues.loop.* 保留域——
      case2clues: {}         #           中间层 loop 必须预声明，条件链才不抛错
      case2testimony: {}    # M5：第二案证词
      case2flags: {}        # M5：第二案推理标记
      case2Evidence: 0      # M5：第二案证据计数
      karma: 0               # M6：荒漠商队善恶值（善举 +1，恶举 -1）
      toleration: 0          # M14：为人的容忍（Altruistic Toleration）—— 为爱我者屈
      independence: 0        # M14：不容忍 —— 对一己不可不诚，不可为人屈
      cardsPlayed: 0         # M14：与「牌」的纠葛次数（1911 打牌 → 1960 过五关，五十年呼应）
      diaryRead: []          # M14：日记回溯已读篇目 ID 数组（plugins/diary.js 读写，存档可恢复）
      dialogueAsked: []      # M15：对话模式已问话题 ID 数组（plugins/dialogue.js 读写，存档可恢复）
      stock: {}              # M8：东市经营库存（trade 插件读写）
      tradeDay: null         # M8：东市经营天数（trade 插件读写，存档可恢复）
      tradeBaseGold: null    # M8：开市基线资金（trade 插件 begin 记录）
      tradeProfit: 0         # M8：收市净赚（trade 插件结算，结局判定用）
      sciEvidence: 0         # M9：科幻篇证据计数
      horrorEvidence: 0      # M9：恐怖篇线索计数
      loopMoves: 3           # M11：子夜集每夜行动力（每次出门-1，@loop 重置回 3）
      riveEvidence: 0        # M13：江畔县志铁证计数（forgery/ledger/arsenic 齐 ≥2 可定罪）
      riverClues: {}         # M13：江畔县志线索（riverClues.ferry 等，须先声明，条件链不抛错）
      snowEvidence: 0        # M15：雪庄八客铁证计数（forgery/ledger/arsenic 齐 ≥2 可定罪）
      snowClues: {}          # M15：雪庄八客线索（snowClues.bailiff 等，须先声明，条件链不抛错）
      crossingClues: {}      # M15：渡口子丑证词（crossingClues.splash 等，须先声明，条件链不抛错）
      midEvidence: 0         # M16：十二时辰关键追问计数（>=4 可拼齐真相）
      midnightClues: {}      # M16：十二时辰六块碎片（midnightClues.zi 等，须先声明，条件链不抛错）
      ferryEvidence: 0       # M17：渡口纪年关键追问计数（>=4 各渡各岸；>=6 且问过老渡工则渡工自渡）
      ferryClues: {}         # M17：渡口纪年线索（ferryClues.boatman 等，须先声明，条件链不抛错）
      echoEvidence: 0        # M18：星港回声铁证计数（slip/tide/account 齐 >=2 可定罪）
      echoClues: {}          # M18：星港回声线索（echoClues.dock 等，须先声明，条件链不抛错）
      trust: 0               # M19：茶肆三遇 信任轴（你信不信她的话）
      closeness: 0           # M19：茶肆三遇 亲近轴（你肯不肯多坐一会儿）
      waterLeft: 2           # M19：最后的水 剩余水量（分水 -1）
      siegeGrain: 3          # M20：城破记与忆 粮（分配/夜战 -1）
      siegeMorale: 3         # M20：城破记与忆 士气（守城 +/-，死守结局需 >=3）
      changanEvidence: 0     # M20：长安西市铁证计数（bosi/pawn/night 齐 >=2 可定罪）
      changanClues: {}       # M20：长安西市线索（changanClues.bosi 等，须先声明，条件链不抛错）
      items: {}
      flags:
        loop: {}             # M11：子夜集循环计数中间层（flags.loop.n，预声明同上理）
        post: {}             # M12：驿路立场中间层（flags.post.adviceGo 等，同上理）
        river: {}            # M13：江畔县志节拍中间层（flags.river.autopsy 等，同上理）
        lantern: {}          # AI-P0：千灯铺愿望标记中间层（flags.lantern.red/river）
        noodle: {}           # AI-P1：面摊客访标记中间层（flags.noodle.soldier/book/singer）
        hushi: {}            # M14：藏晖室札记节拍中间层（flags.hushi.*，P1 幕二起用）
        snow: {}             # M15：雪庄八客节拍中间层（flags.snow.autopsy 等，同上理）
        garrison: {}         # M15：戍卒家书节拍中间层（flags.garrison.chap 等，同上理）
        echo: {}             # M18：星港回声节拍中间层（flags.echo.autopsy 等，同上理）
        grad: {}             # M19：毕业那年节拍中间层（flags.grad.said 等，同上理）
        siege: {}            # M20：城破记与忆节拍中间层（flags.siege.hold 等，同上理）
        changan: {}          # M20：长安西市节拍中间层（flags.changan.ready 等，同上理）

- id: io
  name: ./plugins/console-io.js

- id: engine
  name: ./plugins/engine.js
  config:
    entry: start              # 入场场景 ID
    prompt: '>> '

- id: save
  name: ./plugins/save.js
  config:
    dir: ./saves

- id: achievements
  name: ./plugins/achievements.js
  config:
    list:                     # 成就表（数据驱动，when 为条件表达式，可引用 scene ID）
      - { id: wolf-slayer,  name: 屠狼者,   desc: 战胜林间的独眼狼,         when: 'scene === "wolf-win"' }
      - { id: informant,    name: 星际线人, desc: 在星港酒吧买到情报,       when: 'scene === "starport-bar"' }
      - { id: sword-master, name: 剑主,     desc: 让失落之剑认你为主,       when: 'scene === "ending-win"' }
      - { id: fog-lifted,   name: 雾散还人, desc: 《子夜集》：破局，让雾散，还了人, when: 'scene === "loop.end-good"' }
      - { id: night-walker, name: 夜行人,   desc: 《子夜集》：成了雾里的守夜人,       when: 'scene === "loop.end-deep"' }
      - { id: keep-lamp,    name: 留灯,     desc: 《驿路》：你接下了那盏驿灯,         when: 'scene === "post.end-stay"' }
      - { id: cross-pass,   name: 出关,     desc: 《驿路》：你履约，带她去看驿道那头, when: 'scene === "post.end-go"' }
      - { id: river-truth,  name: 江水为证, desc: 《江畔·县志》：铁证定谳，画工的堤不漏了, when: 'scene === "river.end-truth"' }
      - { id: river-remand, name: 疑案,     desc: 《江畔·县志》：你退堂了，志书照改,      when: 'scene === "river.end-open"' }
      - { id: lantern-keep, name: 守灯人,   desc: 《千灯》：接下了这间灯笼铺,            when: 'scene === "lantern.end-keep"' }
      # M14《藏晖室札记》（胡适日记 1911—1960）
      - { id: hushi-wherehome,    name: 吾乡真在何处, desc: 《藏晖室札记》：留了下来，一辈子没答出那一问,   when: 'scene === "hushi.end-wherehome"' }
      - { id: hushi-sacrifice,    name: 为国家牺牲了, desc: 《藏晖室札记》：二十一年的独立自由，今日起交出去, when: 'scene === "hushi.end-sacrifice"' }
      - { id: hushi-remonstrator, name: 诤臣一百人,   desc: 《藏晖室札记》：当面说了那句逆耳的话,           when: 'scene === "hushi.end-remonstrator"' }
      - { id: hushi-cards,        name: 过五关,       desc: 《藏晖室札记》：真结局——用五十年前的牌，压住今晚, when: 'scene === "hushi.end-cards"' }
      - { id: snow-truth,          name: 旧债有主,   desc: 《雪庄·八客》：铁证定谳，柳记的旧账翻出来了,         when: 'scene === "snow.end-truth"' }
      - { id: snow-open,           name: 雪化人散,   desc: 《雪庄·八客》：退了堂，旧账永沉雪庄,                 when: 'scene === "snow.end-open"' }

- id: combat
  name: ./plugins/combat.js
  config:
    formula:                  # 数值公式参数（可选，覆盖默认值）
      variance: 0.2           # 伤害随机波动 ±20%
      defenseFactor: 0.5      # 每点防御抵消的伤害
      critMult: 1.8           # 暴击倍率
      defendCut: 0.5          # 防御姿态减伤 50%
      fleeChance: 0.45        # 逃跑成功率
    weapons:                  # 武器加成（按背包数量累加到玩家 ATK）
      broken_sword:  { name: 断剑, atk: 2 }
      rusty_sword:   { name: 锈剑, atk: 4 }
      silver_dagger: { name: 银匕首, atk: 3 }   # M2：回廊探索所得
      blade:         { name: 旧刀, atk: 4 }     # M9：武侠篇，师门遗物
    enemies:                  # 敌人字典（数据驱动，与场景字典同哲学）
      wolf:  { name: 独眼狼,   hp: 12, atk: 3, def: 0, crit: 0.10, drops: { gold: +5, 'items.wolf_pelt': +1 } }
      guard: { name: 星港守卫, hp: 16, atk: 4, def: 1, crit: 0.15, drops: { gold: +8 } }
      golem: { name: 石像鬼,   hp: 26, atk: 5, def: 2, crit: 0.15, drops: { gold: +30, 'items.golem_core': +1 } }
      bandit: { name: 沙盗,     hp: 14, atk: 3, def: 1, crit: 0.12, drops: { gold: +12 } }
      robber: { name: 山贼,     hp: 14, atk: 3, def: 1, crit: 0.10, drops: { gold: +10 } }      # M9：武侠篇
      nemesis: { name: 铁爪陈九, hp: 16, atk: 4, def: 1, crit: 0.15, drops: { gold: +25 } }    # M9：武侠篇 Boss（有刀玩家可稳过）

- id: trade
  name: ./plugins/trade.js
  config:
    goods:                    # 商品表：进价（数据驱动，与敌人字典同哲学）
      tea:   { name: 茶, buy: 8 }
      salt:  { name: 盐, buy: 4 }
      cloth: { name: 布, buy: 2 }
    schedule:                 # 确定性行情日程（行=商品，列=第 1..5 天卖出价）
      - [12, 10, 15, 12, 11]  # 茶：第 3 天茶会看涨
      - [5, 7, 5, 6, 5]       # 盐：第 2 天雨天看涨
      - [3, 3, 2, 4, 6]       # 布：第 5 天大集看涨

- id: diary
  name: ./plugins/diary.js   # M14：日记回溯（接管 mode: 'diary'，只读重读已走过的篇目）

- id: dialogue
  name: ./plugins/dialogue.js  # M15：对话/谈判（接管 mode: 'dialogue'，话题询问+注意点预算）

- id: sound
  name: ./plugins/sound.js
  config:
    mute: false               # 静音开关（自动化测试可设为 true）
    sampleRate: 22050
    sounds:                   # 覆盖/扩充默认音效库（事件 → 音色）
      battle-crit: { notes: [330, 440, 587], ms: 70, wave: square, gain: 0.2 }

- id: hot-reload
  name: ./plugins/hot-reload.js
  config:
    paths:                    # 监听的目录（改这些目录下的 .js 即时生效）
      - ./content
    debounce: 200             # 防抖毫秒数
